name: yir-fast-replenish
on:
  workflow_dispatch:
  push: { paths: [.github/workflows/yir_fast_replenish.yml] }
  schedule:
    - cron: '* * * * *'
  repository_dispatch:
    types: [yir_replenish_retrigger]
concurrency:
  group: yir-fast-replenish
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - env:
          MELI_REFRESH_TOKEN_YC_NEW: ${{ secrets.MELI_REFRESH_TOKEN_YC_NEW }}
          TOKEN_SHARED: ${{ secrets.TOKEN_SHARED }}
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
        run: python scripts/yir_fast_replenish.py
      - name: Self-retrigger ~30s
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 30
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/yir_fast_replenish.yml/dispatches" \
            -d '{"ref":"main"}' || true
