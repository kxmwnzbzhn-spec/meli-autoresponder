name: cleanup-clip5-dups
on:
  workflow_dispatch:
concurrency:
  group: stock-cfg-raymundo
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PUSH_PAT || secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests -q
      - env:
          MELI_APP_SECRET:              ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_RAYMUNDO:  ${{ secrets.MELI_REFRESH_TOKEN_RAYMUNDO }}
          TELEGRAM_BOT_TOKEN:           ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:             ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/cleanup_clip5_dups.py
      - name: Commit stock_config_raymundo
        if: always()
        run: |
          git config user.name "publish-bot"
          git config user.email "publish@elitemarket"
          git add stock_config_raymundo.json 2>/dev/null || true
          if git diff --staged --quiet; then echo "no changes"; else
            git commit -m "cleanup: cerrar 3 duplicados Clip 5 v2 + agregar catalog_product_id"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && break
              sleep 5
            done
          fi
