name: up-stock-tmp
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN: ${{ secrets.MELI_REFRESH_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, requests, json
          API="https://api.mercadolibre.com"
          A=os.environ["MELI_APP_ID"]; S=os.environ["MELI_APP_SECRET"]
          rt=os.environ["MELI_REFRESH_TOKEN"]
          tok=requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
              "client_id":A,"client_secret":S,"refresh_token":rt},timeout=20).json()["access_token"]
          h={"Authorization":f"Bearer {tok}"}
          UP="MLMU3920529895"
          # 1. Datos del user-product
          up=requests.get(f"{API}/user-products/{UP}",headers=h)
          print(f"GET /user-products/{UP}: {up.status_code}")
          if up.status_code==200:
              j=up.json()
              print(json.dumps(j,indent=2,ensure_ascii=False)[:1200])
          # 2. Items asociados a este UP
          me=requests.get(f"{API}/users/me",headers=h).json()
          uid=me["id"]
          # buscar items con user_product_id = UP
          for st in ("active","paused"):
              s=requests.get(f"{API}/users/{uid}/items/search?status={st}&user_product_id={UP}",headers=h).json()
              ids=s.get("results",[])
              print(f"\nstatus={st} items={ids}")
              for iid in ids[:5]:
                  it=requests.get(f"{API}/items/{iid}",headers=h).json()
                  print(f"\n  {iid}  '{it.get('title','')[:55]}' status={it.get('status')} qty={it.get('available_quantity')}")
                  for v in it.get("variations",[]):
                      attrs=v.get("attribute_combinations",[])
                      color=next((a.get("value_name","") for a in attrs if a.get("name","").lower()=="color"),"?")
                      print(f"     var={v.get('id')} color={color} qty={v.get('available_quantity')} price={v.get('price')}")
          PY
