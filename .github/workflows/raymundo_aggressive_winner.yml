name: raymundo-aggressive-winner
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { token: '${{ secrets.REPO_PAT }}' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests -q
      - run: |
          python3 - <<'PY'
          import os, json, time, requests
          API="https://api.mercadolibre.com"
          r=requests.post(f"{API}/oauth/token",data={
              "grant_type":"refresh_token",
              "client_id":os.environ["MELI_APP_ID"],
              "client_secret":os.environ["MELI_APP_SECRET"],
              "refresh_token":os.environ["MELI_REFRESH_TOKEN_RAYMUNDO"]
          },timeout=15).json()
          tok=r["access_token"]; uid=r["user_id"]
          h={"Authorization":f"Bearer {tok}","Content-Type":"application/json"}
          print(f"uid={uid}")

          try:
              with open("catalog_war_state.json") as f:
                  war=json.load(f)
          except: war={"items":{}}

          ids=[]
          off=0
          while True:
              j=requests.get(f"{API}/users/{uid}/items/search?status=active&limit=50&offset={off}",headers=h,timeout=15).json()
              res=j.get("results",[])
              ids.extend(res)
              if len(res)<50: break
              off+=50

          my_items={}
          for i in range(0,len(ids),20):
              chunk=",".join(ids[i:i+20])
              rr=requests.get(f"{API}/items?ids={chunk}",headers=h,timeout=20).json()
              for it in rr:
                  if it.get("code")!=200: continue
                  b=it["body"]
                  cpid=b.get("catalog_product_id")
                  if not cpid or not b.get("catalog_listing"): continue
                  my_items[b["id"]]={"cpid":cpid,"price":b.get("price",0),"title":b.get("title","")[:60]}
          print(f"Mis items catalogo: {len(my_items)}")

          winning=[]; sharing=[]; competing=[]
          for iid, info in my_items.items():
              try:
                  ptw_resp = requests.get(f"{API}/items/{iid}/price_to_win",headers=h,timeout=10)
                  if ptw_resp.status_code != 200:
                      print(f"  ptw {iid}: {ptw_resp.status_code} {ptw_resp.text[:100]}")
                      continue
                  ptw = ptw_resp.json()
              except Exception as e:
                  print(f"  err {iid}: {e}")
                  continue
              status = ptw.get("status","")
              ptw_price = ptw.get("price_to_win", info["price"])
              record = {
                  "id":iid,"cpid":info["cpid"],"my_price":info["price"],
                  "ptw":ptw_price,"status":status,"title":info["title"]
              }
              if status == "winning":
                  winning.append(record)
              elif status == "sharing_first_place":
                  sharing.append(record)
              else:
                  competing.append(record)

          print(f"\n📊 Estado actual:")
          print(f"  🥇 Winning: {len(winning)}")
          print(f"  🤝 Sharing: {len(sharing)}")
          print(f"  ❌ Competing: {len(competing)}")
          for r in sharing:
              print(f"    SHARING {r['id']} mi=${r['my_price']:.0f} ptw=${r['ptw']:.0f} — {r['title'][:40]}")
          for r in competing:
              print(f"    COMPETING {r['id']} mi=${r['my_price']:.0f} ptw=${r['ptw']:.0f} status={r['status']} — {r['title'][:40]}")

          adjustments = []
          for r in sharing + competing:
              iid = r["id"]
              war_item = war.get("items",{}).get(iid,{})
              floor = war_item.get("floor", 299)
              target = r["ptw"] - 1 if r["status"]=="sharing_first_place" else r["ptw"]
              target = round(max(floor, target), 2)
              if target >= r["my_price"]:
                  print(f"  ⚠️ {iid} target ${target} >= mi ${r['my_price']:.0f} — skip")
                  continue
              rp=requests.put(f"{API}/items/{iid}",headers=h,json={"price":target},timeout=15)
              if rp.status_code==200:
                  adjustments.append((iid, r["my_price"], target, r["ptw"], r["status"], r["title"]))
                  print(f"  💰 {iid}: ${r['my_price']:.0f} -> ${target:.0f} (ptw ${r['ptw']:.0f}, {r['status']}) — {r['title'][:50]}")
                  war.setdefault("items",{}).setdefault(iid,{}).update({
                      "last_change_at":int(time.time()),"last_action":"down","last_ref":target
                  })
              else:
                  print(f"  ❌ {iid}: {rp.status_code} {rp.text[:120]}")
              time.sleep(0.3)

          with open("catalog_war_state.json","w") as f:
              json.dump(war,f,indent=2,ensure_ascii=False)

          tg_t=os.environ.get("TELEGRAM_BOT_TOKEN")
          tg_c=os.environ.get("TELEGRAM_CHAT_ID")
          if tg_t and tg_c:
              msg=(f"⚔️ Raymundo Catalog War\n\n"
                   f"🥇 Winning: {len(winning)}\n"
                   f"🤝 Sharing: {len(sharing)}\n"
                   f"❌ Competing: {len(competing)}\n"
                   f"💰 Bajadas: {len(adjustments)}")
              if adjustments:
                  msg += "\n\n"
                  for adj in adjustments[:10]:
                      msg += f"• {adj[5][:30]}: ${adj[1]:.0f}->${adj[2]:.0f}\n"
              requests.post(f"https://api.telegram.org/bot{tg_t}/sendMessage",data={
                  "chat_id":tg_c,"text":msg
              },timeout=10)
          PY
        env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_RAYMUNDO: ${{ secrets.MELI_REFRESH_TOKEN_RAYMUNDO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.email b@b.com
          git config user.name bot
          for i in 1 2 3; do
            git pull --rebase 2>/dev/null || true
            git add catalog_war_state.json 2>/dev/null
            if git diff --cached --quiet; then break; fi
            git commit -m "raymundo war v4: ptw" && git push origin main && break
            sleep 5
          done
