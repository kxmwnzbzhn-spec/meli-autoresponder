name: raymundo-aggressive-winner
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { token: '${{ secrets.REPO_PAT }}' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests -q
      - run: |
          python3 - <<'PY'
          import os, json, time, requests
          API="https://api.mercadolibre.com"
          r=requests.post(f"{API}/oauth/token", data={
              "grant_type":"refresh_token",
              "client_id":os.environ["MELI_APP_ID"],
              "client_secret":os.environ["MELI_APP_SECRET"],
              "refresh_token":os.environ["MELI_REFRESH_TOKEN_RAYMUNDO"]
          }, timeout=15).json()
          tok=r["access_token"]; uid=r["user_id"]
          h={"Authorization":f"Bearer {tok}","Content-Type":"application/json"}
          print(f"uid={uid}")

          try:
              with open("catalog_war_state.json") as f:
                  war=json.load(f)
          except: war={"items":{}}

          ids=[]
          off=0
          while True:
              j=requests.get(f"{API}/users/{uid}/items/search?status=active&limit=50&offset={off}",headers=h,timeout=15).json()
              res=j.get("results",[])
              ids.extend(res)
              if len(res)<50: break
              off+=50
              if off>5000: break

          # Get my item details
          my_items={}
          for i in range(0,len(ids),20):
              chunk=",".join(ids[i:i+20])
              rr=requests.get(f"{API}/items?ids={chunk}",headers=h,timeout=20).json()
              for it in rr:
                  if it.get("code")!=200: continue
                  b=it["body"]
                  cpid=b.get("catalog_product_id")
                  if not cpid or not b.get("catalog_listing"): continue
                  my_items[b["id"]]={"cpid":cpid,"price":b.get("price",0),"title":b.get("title","")[:60]}
          print(f"Mis items catalogo: {len(my_items)}")

          losing=[]; tied=[]; winning=[]
          for iid, info in my_items.items():
              cpid = info["cpid"]
              try:
                  prod = requests.get(f"{API}/products/{cpid}", headers=h, timeout=10).json()
              except Exception as e:
                  print(f"  err product {cpid}: {e}")
                  continue
              bbw = prod.get("buy_box_winner") or {}
              winner_item_id = bbw.get("item_id")
              winner_price = bbw.get("price",0) or 0
              winner_seller = bbw.get("seller_id")

              # Check tied: si MELI tiene multiple items al mismo precio
              # Usamos /products/{cpid}/items para ver lista
              try:
                  items_list = requests.get(f"{API}/products/{cpid}/items?limit=20",headers=h,timeout=10).json()
                  comps = items_list.get("results",[])
              except: comps = []
              same_price = [c for c in comps if abs((c.get("price") or 0) - winner_price) < 0.5 and (c.get("status")=="active")]
              tied_with_others = len(same_price) > 1

              record = {
                  "id":iid,"cpid":cpid,"my_price":info["price"],
                  "winner_price":winner_price,"winner_id":winner_item_id,
                  "winner_seller":winner_seller,
                  "is_me_winner": winner_item_id==iid or winner_seller==uid,
                  "tied":tied_with_others,
                  "title":info["title"],
              }
              if record["is_me_winner"] and tied_with_others:
                  tied.append(record)
              elif record["is_me_winner"]:
                  winning.append(record)
              elif winner_price > 0 and info["price"] > winner_price + 0.5:
                  record["delta"] = info["price"] - winner_price
                  losing.append(record)
              else:
                  winning.append(record)  # may be unable to determine

          print(f"\n📊 Resultado:")
          print(f"  🥇 Solo winner: {len(winning)}")
          print(f"  🤝 Tied: {len(tied)}")
          print(f"  ❌ Perdiendo: {len(losing)}")

          adjustments = []
          for info in losing + tied:
              iid = info["id"]
              war_item = war.get("items",{}).get(iid,{})
              floor = war_item.get("floor", 299)

              if info in tied:
                  target = round(info["winner_price"] - 1, 2)
                  reason = "tied"
              else:
                  target = round(info["winner_price"] - 1, 2)
                  reason = "perdiendo"

              if target < floor:
                  print(f"  ⚠️  {iid} target ${target} < floor ${floor}")
                  target = floor

              if target >= info["my_price"]:
                  continue

              rp=requests.put(f"{API}/items/{iid}", headers=h, json={"price":target}, timeout=15)
              if rp.status_code==200:
                  adjustments.append((iid, info["my_price"], target, info["winner_price"], reason, info["title"]))
                  print(f"  💰 {iid}: ${info['my_price']:.0f} → ${target:.0f} (winner ${info['winner_price']:.0f}, {reason}) — {info['title'][:50]}")
                  war.setdefault("items",{}).setdefault(iid,{}).update({
                      "last_change_at": int(time.time()),
                      "last_action":"down","last_ref":target
                  })
              else:
                  print(f"  ❌ {iid}: {rp.status_code} {rp.text[:120]}")
              time.sleep(0.3)

          with open("catalog_war_state.json","w") as f:
              json.dump(war,f,indent=2,ensure_ascii=False)

          tg_t=os.environ.get("TELEGRAM_BOT_TOKEN")
          tg_c=os.environ.get("TELEGRAM_CHAT_ID")
          if tg_t and tg_c:
              msg=(f"⚔️ <b>Raymundo Catalog War</b>\n\n"
                   f"🥇 Winner: {len(winning)}\n"
                   f"🤝 Tied: {len(tied)}\n"
                   f"❌ Perdiendo: {len(losing)}\n"
                   f"💰 Bajadas: {len(adjustments)}")
              if adjustments:
                  msg += "\n\nAjustes:\n"
                  for adj in adjustments[:10]:
                      msg += f"• {adj[5][:30]}: ${adj[1]:.0f}→${adj[2]:.0f} (vs ${adj[3]:.0f})\n"
              requests.post(f"https://api.telegram.org/bot{tg_t}/sendMessage", data={
                  "chat_id":tg_c,"text":msg,"parse_mode":"HTML"
              },timeout=10)
          PY
        env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_RAYMUNDO: ${{ secrets.MELI_REFRESH_TOKEN_RAYMUNDO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.email b@b.com
          git config user.name bot
          for i in 1 2 3; do
            git pull --rebase 2>/dev/null || true
            git add catalog_war_state.json 2>/dev/null
            if git diff --cached --quiet; then break; fi
            git commit -m "raymundo war v2: ajustar" && git push origin main && break
            sleep 5
          done
