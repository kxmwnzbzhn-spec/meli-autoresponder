name: one-shot-activate-jorge-real-stock
on:
  push:
    paths:
      - ".github/workflows/one_shot_activate_jorge_stock.yml"

jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests -q
      - name: Validate monitor
        run: python3 -m py_compile scripts/jorge_luis_real_stock_monitor.py scripts/stock_policy.py
      - name: Run real-stock monitor now
        env:
          RUN_DURATION_SEC: "65"
          MELI_APP_ID_NEW: ${{ secrets.MELI_APP_ID_NEW }}
          MELI_APP_SECRET_NEW: ${{ secrets.MELI_APP_SECRET_NEW }}
          MELI_REFRESH_TOKEN_JORGE_LUIS: ${{ secrets.MELI_REFRESH_TOKEN_JORGE_LUIS }}
        run: python3 scripts/jorge_luis_real_stock_monitor.py
      - name: Save rotated token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_SECRETS }}
        run: |
          if [ -s /tmp/jorge_luis_rotated_token ]; then
            gh secret set MELI_REFRESH_TOKEN_JORGE_LUIS --repo kxmwnzbzhn-spec/meli-autoresponder < /tmp/jorge_luis_rotated_token
          fi
      - name: Persist activation result
        if: success()
        run: |
          mkdir -p state
          printf '%s\n' '{"target_id":"MLM6099889822","real_stock_limit":1,"visible_quantity":1,"monitor":"verified"}' > state/jorge_monitor_6099889822.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/jorge_monitor_6099889822.json
          git commit -m "Record Jorge stock monitor activation for MLM6099889822" || exit 0
          git push
