name: fix-pics-go4-multi
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN: ${{ secrets.MELI_REFRESH_TOKEN }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
        run: |
          python3 - <<'PY'
          import os, requests, time, re
          API="https://api.mercadolibre.com"
          def tok(rt):
              return requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
                  "client_id":os.environ["MELI_APP_ID"],
                  "client_secret":os.environ["MELI_APP_SECRET"],
                  "refresh_token":rt},timeout=20).json().get("access_token")
          tj=tok(os.environ["MELI_REFRESH_TOKEN"])
          tw=tok(os.environ["MELI_REFRESH_TOKEN_WILBERT"])
          hj={"Authorization":f"Bearer {tj}"}
          hw={"Authorization":f"Bearer {tw}"}
          hwj={**hw,"Content-Type":"application/json"}
          
          IID="MLM5300550156"
          # Source de pics por color: el item original Juan multi-color MLM5244765752
          src=requests.get(f"{API}/items/MLM5244765752?include_attributes=all",headers=hj,timeout=20).json()
          var_pics={}
          for v in src.get("variations",[]) or []:
              col=""
              for ac in v.get("attribute_combinations",[]) or []:
                  if (ac.get("name") or "").lower()=="color":
                      col=ac.get("value_name"); break
              pids=v.get("picture_ids") or []
              if col and pids:
                  var_pics[col]=pids[:6]
          print("Pic IDs por color (de Juan source):")
          for c,p in var_pics.items(): print(f"  {c}: {len(p)} pics")
          
          # Get current Wilbert item variations
          target=requests.get(f"{API}/items/{IID}?include_attributes=all",headers=hw,timeout=20).json()
          new_vars=[]
          for v in target.get("variations",[]) or []:
              col=""
              for ac in v.get("attribute_combinations",[]) or []:
                  if (ac.get("name") or "").lower()=="color":
                      col=ac.get("value_name"); break
              # Las pics del juan source son de Juan, no se pueden usar en Wilbert directamente.
              # Hay que UPLOAD de URL.
              # Mejor: tomar URLs del juan source y resubir a Wilbert
              new_vars.append({"id":v["id"],"_color":col,"_orig":v})
          
          # Para cada color, descargar pics del Juan source y resubir a Wilbert
          src_pics_meta={}
          for v in src.get("variations",[]) or []:
              col=""
              for ac in v.get("attribute_combinations",[]) or []:
                  if (ac.get("name") or "").lower()=="color":
                      col=ac.get("value_name"); break
              # extract URLs
              urls=[]
              for p in (v.get("pictures") or []):
                  if p.get("url"): urls.append(p["url"])
              if col: src_pics_meta[col]=urls[:5]
          
          # Si no hay pictures por variation en juan, fallback a buscar items individuales
          if not any(src_pics_meta.values()):
              print("No pics por variation en Juan source. Usando pics globales.")
          else:
              print("Pic URLs por color (Juan):")
              for c,u in src_pics_meta.items():
                  print(f"  {c}: {len(u)} URLs")
          
          # Upload to Wilbert: por cada URL del color, subirla
          new_pic_ids_by_color={}
          for col, urls in src_pics_meta.items():
              new_pic_ids_by_color[col]=[]
              for url in urls[:4]:
                  try:
                      r=requests.post(f"{API}/pictures/items/upload",headers=hw,
                        json={"source":url}, timeout=30)
                      if r.status_code in (200,201):
                          pid=r.json().get("id")
                          if pid: new_pic_ids_by_color[col].append(pid)
                  except: pass
              print(f"  Uploaded {col}: {len(new_pic_ids_by_color[col])}")
          
          # PUT variations con picture_ids por color
          out_vars=[]
          for v in target.get("variations",[]) or []:
              col=""
              for ac in v.get("attribute_combinations",[]) or []:
                  if (ac.get("name") or "").lower()=="color":
                      col=ac.get("value_name"); break
              pids=new_pic_ids_by_color.get(col,[])
              if pids:
                  out_vars.append({
                    "id":v["id"],
                    "price":v.get("price"),
                    "available_quantity":v.get("available_quantity",1),
                    "attribute_combinations":v.get("attribute_combinations",[]),
                    "picture_ids":pids
                  })
              else:
                  out_vars.append({
                    "id":v["id"],
                    "price":v.get("price"),
                    "available_quantity":v.get("available_quantity",1),
                    "attribute_combinations":v.get("attribute_combinations",[]),
                  })
          # Append new pic_ids to global pictures so MELI los reconozca
          all_new=[pid for pids in new_pic_ids_by_color.values() for pid in pids]
          existing_pics=[p["id"] for p in (target.get("pictures") or []) if p.get("id")]
          for pid in all_new:
              if pid not in existing_pics: existing_pics.append(pid)
          existing_pics=existing_pics[:12]
          
          body={"pictures":[{"id":p} for p in existing_pics],"variations":out_vars}
          r=requests.put(f"{API}/items/{IID}",headers=hwj,json=body,timeout=30)
          print(f"\nPUT: {r.status_code}")
          if r.status_code in (200,201):
              for v in r.json().get("variations",[]):
                  ac=v.get("attribute_combinations",[])
                  c=ac[0].get("value_name") if ac else ""
                  print(f"  var color={c} pics={len(v.get('picture_ids',[]))}")
          else:
              print(r.text[:500])
          PY
