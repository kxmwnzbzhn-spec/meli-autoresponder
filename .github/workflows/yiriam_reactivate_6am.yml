name: yiriam_reactivate_6am
on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 12 * * *'   # 12:00 UTC = 06:00 Mérida (UTC-6, sin DST)
    - cron: '5 12 * * *'   # backup +5min
    - cron: '10 12 * * *'  # backup +10min
  repository_dispatch:
    types: [yir_reactivate]
concurrency:
  group: yiriam_reactivate_6am
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - env:
          MELI_REFRESH_TOKEN_YC_NEW: ${{ secrets.MELI_REFRESH_TOKEN_YC_NEW }}
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/yiriam_reactivate_6am.py
