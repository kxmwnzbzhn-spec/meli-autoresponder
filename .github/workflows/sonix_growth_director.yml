name: Growth Director Daily

on:
  schedule:
    - cron: '30 14 * * *'   # 14:30 UTC = 08:30 CDMX (30 min después de auto-audit)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  growth_director:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run growth director
        env:
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
          META_CAPI_ACCESS_TOKEN: ${{ secrets.META_CAPI_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/sonix_growth_director.py
        continue-on-error: true
      - name: Commit report
        run: |
          git config --global user.name 'sonix-growth-director'
          git config --global user.email 'growth@sonix.local'
          git add reports/ || true
          if ! git diff --staged --quiet; then
            git commit -m "growth-director: $(date -u +%Y-%m-%d) daily report"
            git push
          fi
