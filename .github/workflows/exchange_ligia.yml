name: exchange_ligia
on:
  workflow_dispatch:
jobs:
  ex:
    runs-on: ubuntu-latest
    env:
      MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
      MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python scripts/exchange_ligia.py
