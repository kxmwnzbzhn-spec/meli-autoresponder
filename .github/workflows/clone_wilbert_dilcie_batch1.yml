name: clone-wilbert-to-dilcie-batch1
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
          MELI_REFRESH_TOKEN_DILCIE: ${{ secrets.MELI_REFRESH_TOKEN_DILCIE }}
        run: |
          python3 - <<'PY'
          import os, requests, time
          API="https://api.mercadolibre.com"
          def tok(rt):
              return requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
                  "client_id":os.environ["MELI_APP_ID"],
                  "client_secret":os.environ["MELI_APP_SECRET"],
                  "refresh_token":rt},timeout=20).json().get("access_token")
          tw=tok(os.environ["MELI_REFRESH_TOKEN_WILBERT"])
          td=tok(os.environ["MELI_REFRESH_TOKEN_DILCIE"])
          hw={"Authorization":f"Bearer {tw}"}
          hd={"Authorization":f"Bearer {td}"}
          hdj={**hd,"Content-Type":"application/json"}
          # Verificar Dilcie
          me=requests.get(f"{API}/users/me",headers=hd,timeout=15).json()
          print(f"Dilcie UID={me.get('id')} nick={me.get('nickname')}")

          BATCH=["MLM5287368936","MLM5287356778","MLM2907543355","MLM2907544761","MLM5287354114","MLM5287495718"]
          for src in BATCH:
              print(f"\n=== SRC {src} ===")
              it=requests.get(f"{API}/items/{src}?include_attributes=all",headers=hw).json()
              if not it.get("title"):
                  print(f"  err leer src: {it}"); continue
              attrs=[]
              for a in it.get("attributes",[]) or []:
                  if a.get("id") in ("BRAND","MODEL","COLOR","ITEM_CONDITION","DETAILED_MODEL","MAIN_COLOR","ITEM_VOLUME"):
                      v={"id":a["id"]}
                      if a.get("value_id"): v["value_id"]=a["value_id"]
                      if a.get("value_name"): v["value_name"]=a["value_name"]
                      attrs.append(v)
              sale_terms=[]
              for st in it.get("sale_terms",[]) or []:
                  v={"id":st["id"]}
                  if st.get("value_id"): v["value_id"]=st["value_id"]
                  if st.get("value_name"): v["value_name"]=st["value_name"]
                  sale_terms.append(v)
              pics=[{"id":p["id"]} for p in (it.get("pictures") or []) if p.get("id")]
              shipping=it.get("shipping") or {"mode":"me2","free_shipping":True,"logistic_type":"xd_drop_off","local_pick_up":False}
              cpid=it.get("catalog_product_id")
              body={
                "site_id":"MLM",
                "title":(it.get("title") or "")[:60],
                "category_id":it.get("category_id"),
                "price":it.get("price",499),
                "currency_id":"MXN",
                "available_quantity":1,
                "buying_mode":"buy_it_now",
                "listing_type_id":it.get("listing_type_id","gold_pro"),
                "condition":it.get("condition","used"),
                "shipping":shipping,
                "pictures":pics,
                "attributes":attrs,
                "sale_terms":sale_terms,
              }
              if cpid:
                  body["catalog_product_id"]=cpid
                  body["catalog_listing"]=True
              r=requests.post(f"{API}/items",headers=hdj,json=body,timeout=45)
              print(f"  POST: {r.status_code}")
              if r.status_code in (200,201):
                  new=r.json().get("id")
                  print(f"  *** NUEVO: {new} ***  price={body['price']} cpid={cpid}")
              else:
                  print(f"  err: {r.text[:500]}")
              time.sleep(1)
          PY
