name: Meta CAPI Purchase Postback
on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"
jobs:
  postback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - run: python scripts/meta_capi_purchase_postback.py
        env:
          MELI_APP_ID:                  ${{ secrets.MELI_APP_ID }}
          TOKEN_SHARED: ${{ secrets.TOKEN_SHARED }}
          MELI_APP_SECRET:              ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_USER1668:  ${{ secrets.MELI_REFRESH_TOKEN_USER1668 }}
          MELI_REFRESH_TOKEN_YC_NEW:    ${{ secrets.MELI_REFRESH_TOKEN_YC_NEW }}
          MELI_REFRESH_TOKEN_WILBERT:   ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
          META_CAPI_ACCESS_TOKEN:       ${{ secrets.META_CAPI_ACCESS_TOKEN }}
