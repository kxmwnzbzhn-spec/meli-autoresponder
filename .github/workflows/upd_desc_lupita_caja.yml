name: upd_desc_lupita_caja
on:
  workflow_dispatch:
jobs:
  desc:
    runs-on: ubuntu-latest
    env:
      MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
      MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
      MELI_REFRESH_TOKEN_LUPITA: ${{ secrets.MELI_REFRESH_TOKEN_LUPITA }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python scripts/upd_desc_lupita_caja.py
