name: manifest-pull
on:
  workflow_dispatch: {}
  # Cron desde Supabase cada 30 min en horario laboral CDMX.
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests -q
      - env:
          MELI_APP_ID:                ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET:            ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_CLARIBEL: ${{ secrets.MELI_REFRESH_TOKEN_CLARIBEL }}
          MELI_REFRESH_TOKEN_ASVA:     ${{ secrets.MELI_REFRESH_TOKEN_ASVA }}
          MELI_REFRESH_TOKEN_AH:       ${{ secrets.MELI_REFRESH_TOKEN_AH }}
          MELI_REFRESH_TOKEN_YC_NEW:   ${{ secrets.MELI_REFRESH_TOKEN_YC_NEW }}
        run: python scripts/manifest_pull.py
      - name: Commit manifest
        run: |
          git config user.name "manifest-bot"
          git config user.email "manifest-bot@users.noreply.github.com"
          git add data/manifest.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto: refresh manifest $(date -u +%FT%TZ)"
            git push
          fi
