name: go4-multi-desc-update
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
        run: |
          python3 - <<'PY'
          import os, requests
          API="https://api.mercadolibre.com"
          tok=requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
              "client_id":os.environ["MELI_APP_ID"],
              "client_secret":os.environ["MELI_APP_SECRET"],
              "refresh_token":os.environ["MELI_REFRESH_TOKEN_WILBERT"]},timeout=20).json()["access_token"]
          hj={"Authorization":f"Bearer {tok}","Content-Type":"application/json"}
          IID="MLM2911242253"
          DESC=(
            "Bocina Bluetooth Portátil Go 4 - Calidad Espejo OEM 1.1\n\n"
            "Bocina compacta tipo Go 4 con sonido potente y bajos profundos. Fabricación equivalente, calidad OEM 1.1, acabado y materiales premium. Diseño ultra portátil, ideal para llevar a cualquier lugar.\n\n"
            "CARACTERÍSTICAS:\n"
            "- Bluetooth 5.3 con conexión estable y rango amplio\n"
            "- Sonido nítido con bajos profundos y agudos balanceados\n"
            "- Resistencia IP67: protegida contra polvo y sumergible en agua\n"
            "- Batería de larga duración para uso continuo\n"
            "- Carga rápida vía USB-C\n"
            "- Diseño ultra compacto, peso ligero\n"
            "- Cordón integrado para transporte\n\n"
            "IMPORTANTE: Este modelo opera como bocina Bluetooth estándar y NO es compatible con la app móvil JBL Portable ni con Auracast.\n\n"
            "COLORES DISPONIBLES: Azul, Rosa, Rojo, Camuflaje, Negro, Aqua. Selecciona tu color al agregar al carrito.\n\n"
            "GARANTÍA: 30 días del vendedor por defectos de fábrica comprobables con video. No cubre daños por agua excesiva, caídas o mal uso.\n\n"
            "ENVÍO: GRATIS con Mercado Envíos en todo México. Despacho en 24h hábiles desde nuestro almacén. Entrega estimada 2 a 5 días según zona. Producto verificado y probado antes del envío.\n\n"
            "PALABRAS CLAVE: bocina bluetooth portátil, Go 4, parlante portátil, altavoz Bluetooth, IP67, resistente al agua, bocina ultracompacta, bluetooth 5.3, parlante para fiesta, bocina recargable USB-C."
          )
          r=requests.put(f"{API}/items/{IID}/description",headers=hj,json={"plain_text":DESC},timeout=15)
          print(f"PUT desc: {r.status_code}")
          if r.status_code not in (200,201,204):
              r2=requests.post(f"{API}/items/{IID}/description",headers=hj,json={"plain_text":DESC},timeout=15)
              print(f"POST desc: {r2.status_code}")
          PY
