name: publish-alejandra-batch1-20260901

on:
  push:
    paths:
      - ".github/workflows/publish_alejandra_batch1_20260901.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests -q
      - name: Publish first three Jorge catalog products to Alejandra
        env:
          MELI_APP_ID_NEW: ${{ secrets.MELI_APP_ID_NEW }}
          MELI_APP_SECRET_NEW: ${{ secrets.MELI_APP_SECRET_NEW }}
          MELI_REFRESH_TOKEN_ALE: ${{ secrets.MELI_REFRESH_TOKEN_ALE }}
        run: python3 scripts/clone_jorge_to_ale_batch1.py
      - name: Save rotated Alejandra token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_SECRETS }}
        run: |
          if [ -s /tmp/ale_rotated_token ]; then
            gh secret set MELI_REFRESH_TOKEN_ALE --repo kxmwnzbzhn-spec/meli-autoresponder < /tmp/ale_rotated_token
          fi
