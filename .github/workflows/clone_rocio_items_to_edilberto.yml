name: clone-rocio-items-to-edilberto
on:
  workflow_dispatch:

concurrency:
  group: clone-rocio-items-to-edilberto
  cancel-in-progress: false

jobs:
  clone:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests -q
      - name: Validate script
        run: python3 -m py_compile scripts/clone_rocio_items_to_edilberto.py
      - name: Clone and verify both listings
        env:
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_ROCIOANGEL: ${{ secrets.MELI_REFRESH_TOKEN_ROCIOANGEL }}
          MELI_APP_ID_NEW: ${{ secrets.MELI_APP_ID_NEW }}
          MELI_APP_SECRET_NEW: ${{ secrets.MELI_APP_SECRET_NEW }}
          MELI_REFRESH_TOKEN_EDILBERTO: ${{ secrets.MELI_REFRESH_TOKEN_EDILBERTO }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 scripts/clone_rocio_items_to_edilberto.py
      - name: Save rotated refresh tokens
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_SECRETS }}
        run: |
          if [ -s /tmp/rocioangel_rotated_token ]; then
            gh secret set MELI_REFRESH_TOKEN_ROCIOANGEL --repo kxmwnzbzhn-spec/meli-autoresponder < /tmp/rocioangel_rotated_token
          fi
          if [ -s /tmp/edilberto_rotated_token ]; then
            gh secret set MELI_REFRESH_TOKEN_EDILBERTO --repo kxmwnzbzhn-spec/meli-autoresponder < /tmp/edilberto_rotated_token
          fi
      - name: Result
        if: always()
        run: |
          if [ -s /tmp/rocio_to_edilberto_results.json ]; then
            cat /tmp/rocio_to_edilberto_results.json
          fi
