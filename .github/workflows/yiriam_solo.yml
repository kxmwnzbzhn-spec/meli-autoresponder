name: yiriam-solo
on: { workflow_dispatch: }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get install -y poppler-utils
      - run: pip install requests pypdf reportlab pdf2image Pillow -q
      - env:
          MELI_APP_SECRET:                ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_YC_NEW:      ${{ secrets.MELI_REFRESH_TOKEN_YC_NEW }}
        run: python scripts/yiriam_solo.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yiriam-solo
          path: ETIQUETAS_YIRIAM_TODAS.pdf
