name: Exportar etiquetas Rosa Maria cifradas

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar el consolidado original
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 34156097362 --repo kxmwnzbzhn-spec/meli-autoresponder --name rosa-maria-ready-to-print
      - name: Publicar exportacion temporal cifrada
        env:
          EXPORT_PUBLIC_KEY_B64: 
        run: |
          test -s ETIQUETAS_ROSA_MARIA_READY_TO_PRINT.pdf
          test -s MANIFEST_ROSA_MARIA_READY_TO_PRINT.json
          printf '%s' "$EXPORT_PUBLIC_KEY_B64" | base64 -d > /tmp/rosa-export-public.pem
          openssl rand 32 > /tmp/rosa-export-aes.key
          openssl enc -aes-256-cbc -pbkdf2 -salt \
            -in ETIQUETAS_ROSA_MARIA_READY_TO_PRINT.pdf \
            -out /tmp/ETIQUETAS_ROSA_MARIA_READY_TO_PRINT.pdf.enc \
            -pass file:/tmp/rosa-export-aes.key
          openssl pkeyutl -encrypt -pubin -inkey /tmp/rosa-export-public.pem \
            -in /tmp/rosa-export-aes.key \
            -out /tmp/ETIQUETAS_ROSA_MARIA_READY_TO_PRINT.key.enc \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout --orphan secure-export-rosa-maria
          git rm -rf .
          mkdir -p secure_export
          cp /tmp/ETIQUETAS_ROSA_MARIA_READY_TO_PRINT.pdf.enc secure_export/
          cp /tmp/ETIQUETAS_ROSA_MARIA_READY_TO_PRINT.key.enc secure_export/
          cp MANIFEST_ROSA_MARIA_READY_TO_PRINT.json secure_export/
          git add secure_export
          git commit -m "Exportacion temporal cifrada de etiquetas Rosa Maria"
          git push --force origin HEAD:secure-export-rosa-maria
