name: one-shot-audit-after-zero-stock-batch
on:
  push:
    paths:
      - ".github/workflows/one_shot_audit_after_zero_stock.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests -q
      - name: Audit current source and Jorge state
        env:
          MELI_APP_ID_NEW: ${{ secrets.MELI_APP_ID_NEW }}
          MELI_APP_SECRET_NEW: ${{ secrets.MELI_APP_SECRET_NEW }}
          MELI_REFRESH_TOKEN_EDILBERTO: ${{ secrets.MELI_REFRESH_TOKEN_EDILBERTO }}
          MELI_REFRESH_TOKEN_JORGE_LUIS: ${{ secrets.MELI_REFRESH_TOKEN_JORGE_LUIS }}
        run: python3 scripts/audit_edilberto_batch_real_stock.py 2>&1 | tee /tmp/post_batch_audit.log
      - name: Save rotated tokens
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_SECRETS }}
        run: |
          if [ -s /tmp/edilberto_rotated_token ]; then
            gh secret set MELI_REFRESH_TOKEN_EDILBERTO --repo kxmwnzbzhn-spec/meli-autoresponder < /tmp/edilberto_rotated_token
          fi
          if [ -s /tmp/jorge_luis_rotated_token ]; then
            gh secret set MELI_REFRESH_TOKEN_JORGE_LUIS --repo kxmwnzbzhn-spec/meli-autoresponder < /tmp/jorge_luis_rotated_token
          fi
      - name: Persist audit
        if: always()
        run: |
          mkdir -p state
          if [ -s /tmp/post_batch_audit.log ]; then
            cp /tmp/post_batch_audit.log state/post_zero_stock_batch_audit.log
          else
            printf '%s\n' 'audit produced no output' > state/post_zero_stock_batch_audit.log
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/post_zero_stock_batch_audit.log
          git commit -m "Record post-batch Jorge catalog audit" || exit 0
          git push
