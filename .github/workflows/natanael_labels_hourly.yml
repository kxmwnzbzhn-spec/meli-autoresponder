name: Natanael - etiquetas pendientes cada hora
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export_labels:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          pip install requests pypdf reportlab pdf2image Pillow -q
      - name: Extraer ready_to_print y ready_to_ship de Natanael
        env:
          ACCOUNT: Natanael
          ALLOWED_SUBSTATUSES: ready_to_print,ready_to_ship
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_NATANAEL: ${{ secrets.MELI_REFRESH_TOKEN_NATANAEL }}
        run: python scripts/labels_one.py
      - name: Guardar PDF consolidado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etiquetas-natanael-pendientes-horario
          path: ETIQUETAS_*.pdf
          if-no-files-found: warn
          retention-days: 7
