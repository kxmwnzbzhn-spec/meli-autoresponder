name: daily-pro
# 1 workflow, 4 jobs (3 build en paralelo + 1 combine).
# Disparado por Supabase pg_cron a las 13:05 UTC (7:05 AM CDMX).
on:
  workflow_dispatch:
    inputs:
      force_regen:
        description: 'Regenerar aunque ya exista PDF de hoy'
        required: false
        type: string
        default: ''

jobs:
  build-claribel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install requests pypdf reportlab pdf2image Pillow -q
      - env:
          ACCOUNT: Claribel
          MELI_APP_ID:                 ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET:             ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_CLARIBEL: ${{ secrets.MELI_REFRESH_TOKEN_CLARIBEL }}
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:     ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/labels_one.py
      - uses: actions/upload-artifact@v4
        with:
          name: labels-Claribel
          path: ETIQUETAS_CLARIBEL.pdf
          if-no-files-found: error
          retention-days: 7

  build-asva:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install requests pypdf reportlab pdf2image Pillow -q
      - env:
          ACCOUNT: Asva
          MELI_APP_ID:             ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET:         ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_ASVA: ${{ secrets.MELI_REFRESH_TOKEN_ASVA }}
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:     ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/labels_one.py
      - uses: actions/upload-artifact@v4
        with:
          name: labels-Asva
          path: ETIQUETAS_ASVA.pdf
          if-no-files-found: error
          retention-days: 7

  build-adrian:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install requests pypdf reportlab pdf2image Pillow -q
      - env:
          ACCOUNT: Ah
          MELI_APP_ID:           ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET:       ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_AH: ${{ secrets.MELI_REFRESH_TOKEN_AH }}
          SUPABASE_URL:             ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:     ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/labels_one.py
      - uses: actions/upload-artifact@v4
        with:
          name: labels-Ah
          path: ETIQUETAS_AH.pdf
          if-no-files-found: error
          retention-days: 7

  build-mc:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: |
          sudo apt-get update || true
          sudo apt-get install -y poppler-utils || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - run: pip install requests pypdf reportlab pdf2image Pillow -q
      - env:
          ACCOUNT: Mc
          MELI_APP_ID:             ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET:         ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_MC:   ${{ secrets.MELI_REFRESH_TOKEN_MC }}
          SUPABASE_URL:            ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:    ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/labels_one.py
      - uses: actions/upload-artifact@v4
        with:
          name: labels-Mc
          path: ETIQUETAS_MC.pdf
          if-no-files-found: error
          retention-days: 7

  combine-and-upload:
    needs: [build-claribel, build-asva, build-adrian, build-mc]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests pypdf google-api-python-client google-auth google-auth-oauthlib -q
      - uses: actions/download-artifact@v4
        with:
          path: ./pdfs
      - run: ls -R ./pdfs
      - env:
          FORCE_REGEN:                ${{ inputs.force_regen }}
          GOOGLE_OAUTH_CLIENT_ID:     ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN:         ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:           ${{ secrets.TELEGRAM_CHAT_ID }}
          DRIVE_FOLDER_ID:            '1aIDN3iq6zwCacL57iamptvQCPoSDyRbL'
          SUPABASE_URL:               ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:       ${{ secrets.SUPABASE_SERVICE_KEY }}
          GITHUB_RUN_ID:              ${{ github.run_id }}
        run: python scripts/daily_combine.py
