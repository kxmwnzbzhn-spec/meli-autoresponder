name: Exportar etiquetas DIDER listas para imprimir
on:
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests pypdf -q
      - name: Generar PDF consolidado sin picking list
        env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_DIDER: ${{ secrets.MELI_REFRESH_TOKEN_DIDER }}
        run: python scripts/export_dider_ready_to_print.py
      - name: Guardar token rotado
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_SECRETS }}
        run: |
          if [ -s /tmp/dider_labels_rotated_token ]; then
            gh secret set MELI_REFRESH_TOKEN_DIDER --repo kxmwnzbzhn-spec/meli-autoresponder < /tmp/dider_labels_rotated_token
          fi
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: etiquetas-dider-listas-para-imprimir
          path: |
            ETIQUETAS_DIDER_LISTAS_PARA_IMPRIMIR.pdf
            MANIFEST_DIDER.json
          retention-days: 1
