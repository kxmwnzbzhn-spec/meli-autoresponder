name: one-shot-clone-6075598700-to-jorge
on:
  push:
    paths:
      - ".github/workflows/one_shot_clone_6075598700.yml"

concurrency:
  group: one-shot-clone-6075598700
  cancel-in-progress: false

jobs:
  clone:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests -q
      - name: Validate clone safety
        run: python3 -m py_compile scripts/clone_edilberto_to_jorge_one.py
      - name: Clone exact catalog once
        env:
          SOURCE_ITEM_ID: "6075598700"
          MELI_APP_ID_NEW: ${{ secrets.MELI_APP_ID_NEW }}
          MELI_APP_SECRET_NEW: ${{ secrets.MELI_APP_SECRET_NEW }}
          MELI_REFRESH_TOKEN_EDILBERTO: ${{ secrets.MELI_REFRESH_TOKEN_EDILBERTO }}
          MELI_REFRESH_TOKEN_JORGE_LUIS: ${{ secrets.MELI_REFRESH_TOKEN_JORGE_LUIS }}
        run: python3 scripts/clone_edilberto_to_jorge_one.py
      - name: Save rotated refresh tokens
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_SECRETS }}
        run: |
          if [ -s /tmp/edilberto_rotated_token ]; then
            gh secret set MELI_REFRESH_TOKEN_EDILBERTO --repo kxmwnzbzhn-spec/meli-autoresponder < /tmp/edilberto_rotated_token
          fi
          if [ -s /tmp/jorge_luis_rotated_token ]; then
            gh secret set MELI_REFRESH_TOKEN_JORGE_LUIS --repo kxmwnzbzhn-spec/meli-autoresponder < /tmp/jorge_luis_rotated_token
          fi
      - name: Persist verified result
        if: always()
        run: |
          mkdir -p state
          if [ -s /tmp/edilberto_to_jorge_result.json ]; then
            cp /tmp/edilberto_to_jorge_result.json state/clone_6075598700_result.json
          else
            printf '%s\n' '{"source_id":"MLM6075598700","status":"failed","result":"no verified clone result"}' > state/clone_6075598700_result.json
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/clone_6075598700_result.json
          git commit -m "Record verified Jorge clone result for 6075598700" || exit 0
          git push
