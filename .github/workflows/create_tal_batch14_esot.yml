name: create_tal_batch14_esot
on: { workflow_dispatch: {}, push: { paths: ['.github/workflows/create_tal_batch14_esot.yml'] } }
permissions: {contents: write}
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_ADRIAN: ${{ secrets.MELI_REFRESH_TOKEN_ADRIAN }}
        run: python scripts/create_tal_batch14_esot.py
