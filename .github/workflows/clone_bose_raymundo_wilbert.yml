name: clone-bose-raymundo-wilbert
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_RAYMUNDO: ${{ secrets.MELI_REFRESH_TOKEN_RAYMUNDO }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
        run: |
          python3 - <<'PY'
          import os, requests, time, re
          API="https://api.mercadolibre.com"
          def tok(rt):
              return requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
                  "client_id":os.environ["MELI_APP_ID"],
                  "client_secret":os.environ["MELI_APP_SECRET"],
                  "refresh_token":rt},timeout=20).json().get("access_token")
          tr=tok(os.environ["MELI_REFRESH_TOKEN_RAYMUNDO"])
          tw=tok(os.environ["MELI_REFRESH_TOKEN_WILBERT"])
          hr={"Authorization":f"Bearer {tr}"}
          hwj={"Authorization":f"Bearer {tw}","Content-Type":"application/json"}
          UID_R=3338633403
          # Buscar Bose en Raymundo (todos status)
          ids=[]; off=0
          while True:
              j=requests.get(f"{API}/users/{UID_R}/items/search?limit=50&offset={off}",headers=hr,timeout=20).json()
              ids+=j.get("results",[])
              off+=50
              if off>=j.get("paging",{}).get("total",0) or not j.get("results"): break
          items={}
          for i in range(0,len(ids),20):
              r=requests.get(f"{API}/items?ids={','.join(ids[i:i+20])}&attributes=id,title,status",headers=hr,timeout=25).json()
              for it in r:
                  if it.get("code")==200: items[it["body"]["id"]]=it["body"]
          BOSE_RX=re.compile(r"bose|soundlink",re.I)
          boses=[(iid,b.get("title","")) for iid,b in items.items() if BOSE_RX.search(b.get("title",""))]
          print(f"Bose encontrados: {len(boses)}")
          for r in boses: print(f"  {r[0]} '{r[1][:60]}'")
          # Clonar
          for src,title in boses:
              full=requests.get(f"{API}/items/{src}?include_attributes=all",headers=hr,timeout=20).json()
              attrs=[]
              for a in full.get("attributes",[]) or []:
                  if a.get("id") in ("BRAND","MODEL","COLOR","ITEM_CONDITION","DETAILED_MODEL","MAIN_COLOR","ITEM_VOLUME","MODEL_NAME"):
                      v={"id":a["id"]}
                      if a.get("value_id"): v["value_id"]=a["value_id"]
                      if a.get("value_name"): v["value_name"]=a["value_name"]
                      attrs.append(v)
              sale_terms=[]
              for st in full.get("sale_terms",[]) or []:
                  v={"id":st["id"]}
                  if st.get("value_id"): v["value_id"]=st["value_id"]
                  if st.get("value_name"): v["value_name"]=st["value_name"]
                  sale_terms.append(v)
              if not any(s.get("id")=="WARRANTY_TIME" for s in sale_terms):
                  sale_terms.append({"id":"WARRANTY_TYPE","value_name":"Garantía del vendedor"})
                  sale_terms.append({"id":"WARRANTY_TIME","value_name":"30 días"})
              pics=[{"id":p["id"]} for p in (full.get("pictures") or []) if p.get("id")]
              shipping=full.get("shipping") or {"mode":"me2","free_shipping":True,"logistic_type":"xd_drop_off","local_pick_up":False}
              cpid=full.get("catalog_product_id")
              body={"site_id":"MLM","title":title[:60],"category_id":full.get("category_id"),
                "price":full.get("price",3499),"currency_id":"MXN","available_quantity":1,
                "buying_mode":"buy_it_now","listing_type_id":full.get("listing_type_id","gold_pro"),
                "condition":full.get("condition","new"),"shipping":shipping,"pictures":pics,
                "attributes":attrs,"sale_terms":sale_terms}
              if cpid:
                  body["catalog_product_id"]=cpid; body["catalog_listing"]=True
              r=requests.post(f"{API}/items",headers=hwj,json=body,timeout=45)
              print(f"\n{src} → POST: {r.status_code}")
              if r.status_code in (200,201):
                  new=r.json().get("id")
                  print(f"  *** NUEVO Wilbert: {new} *** price=${body['price']} cpid={cpid}")
              else:
                  print(f"  err: {r.text[:400]}")
              time.sleep(1)
          PY
