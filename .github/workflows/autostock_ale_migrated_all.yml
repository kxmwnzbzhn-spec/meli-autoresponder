name: Autostock Alejandra publicaciones migradas
on:
  push:
    paths:
      - 'config/ale_autostock_migrated_ids.json'
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * *'
concurrency:
  group: autostock-ale-migrated-all
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests -q
      - name: Preparar acceso
        env:
          MELI_APP_ID_NEW: ${{ secrets.MELI_APP_ID_NEW }}
          MELI_APP_SECRET_NEW: ${{ secrets.MELI_APP_SECRET_NEW }}
          MELI_REFRESH_TOKEN_ALE: ${{ secrets.MELI_REFRESH_TOKEN_ALE }}
        run: python scripts/prepare_ale_autostock_token.py
      - name: Guardar token rotado
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_SECRETS }}
        run: gh secret set MELI_REFRESH_TOKEN_ALE --repo "${{ github.repository }}" < /tmp/ale_rotated_token
      - name: Vigilar cada 30 segundos
        run: python scripts/autostock_ale_migrated_all.py
      - name: Reiniciar monitor
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_SECRETS }}
        run: gh workflow run autostock_ale_migrated_all.yml --repo "${{ github.repository }}" --ref main
