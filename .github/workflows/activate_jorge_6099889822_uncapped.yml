name: activate-jorge-6099889822-uncapped

on:
  push:
    paths:
      - ".github/workflows/activate_jorge_6099889822_uncapped.yml"
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests -q
      - name: Validate scripts
        run: |
          python3 -m py_compile scripts/activate_jorge_6099889822_uncapped.py
          python3 -m py_compile scripts/jorge_luis_real_stock_monitor.py scripts/stock_policy.py
      - name: Activate only MLM6099889822
        env:
          MELI_APP_ID_NEW: ${{ secrets.MELI_APP_ID_NEW }}
          MELI_APP_SECRET_NEW: ${{ secrets.MELI_APP_SECRET_NEW }}
          MELI_REFRESH_TOKEN_JORGE_LUIS: ${{ secrets.MELI_REFRESH_TOKEN_JORGE_LUIS }}
        run: python3 scripts/activate_jorge_6099889822_uncapped.py
      - name: Save rotated refresh token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_SECRETS }}
        run: |
          if [ -s /tmp/jorge_luis_rotated_token ]; then
            gh secret set MELI_REFRESH_TOKEN_JORGE_LUIS --repo kxmwnzbzhn-spec/meli-autoresponder < /tmp/jorge_luis_rotated_token
          fi
      - name: Restart continuous Jorge monitor
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_SECRETS }}
        run: gh workflow run jorge_luis_real_stock_monitor.yml --repo kxmwnzbzhn-spec/meli-autoresponder -f duration_sec=19800
