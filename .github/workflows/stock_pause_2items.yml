name: stock-pause-2items
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
        run: |
          python3 - <<'PY'
          import os, requests
          API="https://api.mercadolibre.com"
          tok=requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
              "client_id":os.environ["MELI_APP_ID"],
              "client_secret":os.environ["MELI_APP_SECRET"],
              "refresh_token":os.environ["MELI_REFRESH_TOKEN_WILBERT"]},timeout=20).json()["access_token"]
          h={"Authorization":f"Bearer {tok}"}
          hj={**h,"Content-Type":"application/json"}
          # 1) Stock visible 1 a MLM2910880717
          it=requests.get(f"{API}/items/MLM2910880717",headers=h).json()
          print(f"MLM2910880717 antes: status={it.get('status')} qty={it.get('available_quantity')}")
          if (it.get("available_quantity") or 0)!=1:
              r=requests.put(f"{API}/items/MLM2910880717",headers=hj,json={"available_quantity":1},timeout=15)
              print(f"  PUT qty=1: {r.status_code} {r.text[:120] if r.status_code not in (200,201) else 'OK'}")
          else:
              print("  ya está qty=1")
          # 2) Pausar MLM2910457937
          r=requests.put(f"{API}/items/MLM2910457937",headers=hj,json={"status":"paused"},timeout=15)
          print(f"MLM2910457937 pause: {r.status_code} {'OK' if r.status_code in (200,201) else r.text[:120]}")
          PY
