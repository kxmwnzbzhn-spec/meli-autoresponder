name: apply-promo-v2
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
        run: |
          python3 - <<'PY'
          import os, requests, time
          from datetime import datetime, timedelta, timezone
          API="https://api.mercadolibre.com"
          tok=requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
              "client_id":os.environ["MELI_APP_ID"],
              "client_secret":os.environ["MELI_APP_SECRET"],
              "refresh_token":os.environ["MELI_REFRESH_TOKEN_WILBERT"]},timeout=20).json()["access_token"]
          h={"Authorization":f"Bearer {tok}"}
          hj={**h,"Content-Type":"application/json"}
          # Fechas: hoy CDMX (-06:00) hasta +30 días
          now=datetime.now(timezone(timedelta(hours=-6)))
          start_date=now.strftime("%Y-%m-%dT%H:%M:%S.000-06:00")
          finish_date=(now+timedelta(days=30)).strftime("%Y-%m-%dT23:59:59.000-06:00")
          print(f"start={start_date} finish={finish_date}")
          ALL=[
            (549,["MLM2910457917","MLM2910880717","MLM2910806817"]),
            (449,["MLM2910806845","MLM2910768333","MLM2910806881"]),
            (799,["MLM2910880769","MLM2910806871","MLM2910768361","MLM2910806853","MLM2910457991","MLM2910457983","MLM2910457973"])
          ]
          for target,items in ALL:
              for iid in items:
                  it=requests.get(f"{API}/items/{iid}",headers=h).json()
                  cur=it.get("price",0)
                  if cur<=target:
                      print(f"  {iid} cur=${cur} ≤ ${target}, skip")
                      continue
                  body={"deal_price":target,"offer_type":"PRICE_DISCOUNT",
                    "promotion_type":"PRICE_DISCOUNT",
                    "start_date":start_date,"finish_date":finish_date}
                  r=requests.put(f"{API}/seller-promotions/items/{iid}?app_version=v2",headers=hj,json=body,timeout=20)
                  if r.status_code in (200,201):
                      print(f"  ✓ {iid} {cur}→{target}")
                  else:
                      print(f"  ✗ {iid}: {r.status_code} {r.text[:200]}")
                  time.sleep(0.3)
          PY
