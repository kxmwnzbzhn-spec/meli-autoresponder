name: retry_wilbert_desc
on: { workflow_dispatch: {}, push: { paths: ['.github/workflows/retry_wilbert_desc.yml'] } }
permissions: {contents: write}
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests
      - env:
          TOKEN_SHARED: ${{ secrets.TOKEN_SHARED }}
        run: python scripts/retry_wilbert_desc.py
