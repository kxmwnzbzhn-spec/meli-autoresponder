name: wilbert-force-active-all
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
        run: |
          python3 - <<'PY'
          import os, requests, json, time
          API="https://api.mercadolibre.com"
          tok=requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
              "client_id":os.environ["MELI_APP_ID"],
              "client_secret":os.environ["MELI_APP_SECRET"],
              "refresh_token":os.environ["MELI_REFRESH_TOKEN_WILBERT"]},timeout=20).json()["access_token"]
          h={"Authorization":f"Bearer {tok}"}
          hj={**h,"Content-Type":"application/json"}
          UID=3367276814
          try: BL=set(x["item_id"] for x in json.load(open("blacklist.json")).get("items",[]))
          except: BL=set()
          ids=[]; off=0
          while True:
              j=requests.get(f"{API}/users/{UID}/items/search?limit=50&offset={off}",headers=h,timeout=20).json()
              r=j.get("results",[]); ids+=r
              off+=50
              if off>=j.get("paging",{}).get("total",0) or not r: break
          print(f"Total items: {len(ids)}")
          ok=0; err=0; bl=0; skip_active=0
          for iid in ids:
              if iid in BL: bl+=1; continue
              # Probar status active + qty 1
              r=requests.put(f"{API}/items/{iid}",headers=hj,json={"status":"active","available_quantity":1},timeout=15)
              if r.status_code in (200,201): ok+=1
              else:
                  # retry sólo status
                  r2=requests.put(f"{API}/items/{iid}",headers=hj,json={"status":"active"},timeout=15)
                  if r2.status_code in (200,201): ok+=1
                  else: err+=1
              time.sleep(0.05)
          print(f"\nactivated={ok} errors={err} bl_skip={bl}")
          PY
