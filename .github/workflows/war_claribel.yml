name: war-claribel
on:
  workflow_dispatch: {}
  push: { paths: [.github/workflows/war_claribel.yml] }
  schedule:
    - cron: '*/3 * * * *'
concurrency: { group: war-claribel, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_CLARIBEL: ${{ secrets.MELI_REFRESH_TOKEN_CLARIBEL }}
          TOKEN_SHARED: ${{ secrets.TOKEN_SHARED }}
        run: python scripts/war_claribel.py
