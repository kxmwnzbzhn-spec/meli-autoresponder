name: check_all_status
on: { workflow_dispatch: {}, push: { paths: ['.github/workflows/check_all_status.yml'] } }
permissions: {contents: write}
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          TOKEN_SHARED: ${{ secrets.TOKEN_SHARED }}
          MELI_REFRESH_TOKEN_ADRIAN: ${{ secrets.MELI_REFRESH_TOKEN_ADRIAN }}
          MELI_REFRESH_TOKEN_MAYRELY: ${{ secrets.MELI_REFRESH_TOKEN_MAYRELY }}
          MELI_REFRESH_TOKEN_ASGARI: ${{ secrets.MELI_REFRESH_TOKEN_ASGARI }}
        run: python scripts/check_all_status.py
