name: exchange_code_asva
on: { workflow_dispatch: {}, push: { paths: [.github/workflows/exchange_code_asva.yml] } }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
        run: python scripts/exchange_code_asva.py
