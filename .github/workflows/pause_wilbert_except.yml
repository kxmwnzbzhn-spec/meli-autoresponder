name: pause-wilbert-except
on: { workflow_dispatch: {}, push: { paths: [.github/workflows/pause_wilbert_except.yml] } }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
          TOKEN_SHARED: ${{ secrets.TOKEN_SHARED }}
        run: python scripts/pause_wilbert_except.py
