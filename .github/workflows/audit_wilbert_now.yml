name: audit-wilbert-now
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
        run: |
          python3 - <<'PY'
          import os, requests, time
          API="https://api.mercadolibre.com"
          tok=requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
              "client_id":os.environ["MELI_APP_ID"],
              "client_secret":os.environ["MELI_APP_SECRET"],
              "refresh_token":os.environ["MELI_REFRESH_TOKEN_WILBERT"]},timeout=20).json()["access_token"]
          h={"Authorization":f"Bearer {tok}"}
          uid=requests.get(f"{API}/users/me",headers=h).json()["id"]
          ids=[]
          for st in ("active",):
              off=0
              while True:
                  j=requests.get(f"{API}/users/{uid}/items/search?status={st}&limit=50&offset={off}",headers=h,timeout=20).json()
                  r=j.get("results",[]); ids+=r
                  off+=50
                  if off>=j.get("paging",{}).get("total",0) or not r: break
          items={}
          for i in range(0,len(ids),20):
              r=requests.get(f"{API}/items?ids={','.join(ids[i:i+20])}&attributes=id,title,price,status",headers=h,timeout=20).json()
              for it in r:
                  if it.get("code")==200: items[it["body"]["id"]]=it["body"]
          losing=[]; winning_alone=0; sharing=[]; total_speakers=0
          for iid,b in items.items():
              t=(b.get("title") or "").lower()
              if "perfume" in t or "edp" in t or "armaf" in t or "lattafa" in t or "alchemia" in t: continue
              total_speakers+=1
              try:
                  p=requests.get(f"{API}/items/{iid}/price_to_win?version=v2",headers=h,timeout=12).json()
              except: continue
              cur=b.get("price") or 0
              ptw=p.get("price_to_win") or 0
              pst=p.get("status","")
              sh=p.get("competitors_sharing_first_place") or 0
              gap=int(cur-ptw)
              tt=(b.get("title") or "")[:48]
              if pst not in ("winning",):
                  losing.append((iid,cur,ptw,gap,pst,sh,tt))
              elif sh>0:
                  sharing.append((iid,cur,ptw,sh,tt))
              else:
                  winning_alone+=1
              time.sleep(0.04)
          print(f"\n=== {total_speakers} bocinas active analizadas ===")
          print(f"WINNING SOLO: {winning_alone}")
          print(f"\n=== {len(losing)} ITEMS PERDIENDO/NOT WINNING ===")
          print(f"{'iid':<14} {'cur':>5} {'ptw':>5} {'gap':>5} {'st':<14} sh  title")
          for r in sorted(losing,key=lambda x:-x[3])[:30]:
              print(f"{r[0]:<14} {r[1]:>5} {r[2]:>5} {r[3]:>5} {r[4]:<14} {r[5]:>2}  {r[6]}")
          print(f"\n=== {len(sharing)} EMPATANDO ===")
          for r in sharing[:10]:
              print(f"{r[0]:<14} {r[1]:>5} {r[2]:>5} sh={r[3]} {r[4]}")
          PY
