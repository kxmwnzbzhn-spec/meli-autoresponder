name: audit-wilbert-now
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
        run: |
          python3 - <<'PY'
          import os, requests, time
          API="https://api.mercadolibre.com"
          tok=requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
              "client_id":os.environ["MELI_APP_ID"],
              "client_secret":os.environ["MELI_APP_SECRET"],
              "refresh_token":os.environ["MELI_REFRESH_TOKEN_WILBERT"]},timeout=20).json()["access_token"]
          h={"Authorization":f"Bearer {tok}"}
          me=requests.get(f"{API}/users/me",headers=h).json()
          uid=me["id"]
          # Listar todos active+paused
          ids=[]
          for st in ("active","paused"):
              off=0
              while True:
                  j=requests.get(f"{API}/users/{uid}/items/search?status={st}&limit=50&offset={off}",headers=h,timeout=20).json()
                  r=j.get("results",[]); ids+=r
                  off+=50
                  if off>=j.get("paging",{}).get("total",0) or not r: break
          # Bulk
          items={}
          for i in range(0,len(ids),20):
              c=ids[i:i+20]
              r=requests.get(f"{API}/items?ids={','.join(c)}&attributes=id,title,price,status",headers=h,timeout=20).json()
              for it in r:
                  if it.get("code")==200:
                      b=it["body"]; items[b["id"]]=b
          print(f"{'iid':<14} {'st':<7} {'cur':>6} {'ptw':>6} {'gap':>5} {'pt_st':<10} {'sh':>2} {'title':<48}")
          losing=0; winning_alone=0; floor=0; up_arr=0
          for iid, b in items.items():
              if b.get("status")!="active": continue
              t=b.get("title","")[:48]
              if "perfume" in t.lower() or "edp" in t.lower() or "armaf" in t.lower(): continue
              try:
                  p=requests.get(f"{API}/items/{iid}/price_to_win?version=v2",headers=h,timeout=12).json()
              except: continue
              cur=b.get("price"); ptw=p.get("price_to_win") or 0
              pst=p.get("status",""); sh=p.get("competitors_sharing_first_place",0)
              gap=int((cur or 0)-(ptw or 0))
              if pst=="competing" or pst=="not_winning": losing+=1
              elif pst=="winning" and sh==0: winning_alone+=1
              elif pst=="sharing": floor+=1
              flag=""
              if pst=="competing" or pst=="not_winning": flag="LOSING"
              elif pst=="winning" and gap>50 and sh==0: flag="UP_OK"; up_arr+=1
              if flag:
                  print(f"{iid:<14} {b.get('status'):<7} {cur:>6} {ptw:>6} {gap:>5} {pst:<10} {sh:>2} {t}  [{flag}]")
              time.sleep(0.05)
          print(f"\n=== TOTALES ===")
          print(f"  losing: {losing}")
          print(f"  winning_alone: {winning_alone}")
          print(f"  floor/sharing: {floor}")
          print(f"  up_ok (gap>50): {up_arr}")
          PY
