name: new-pubs-5-wilbert
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
        run: |
          python3 - <<'PY'
          import os, requests, time, json
          API="https://api.mercadolibre.com"
          tok=requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
              "client_id":os.environ["MELI_APP_ID"],
              "client_secret":os.environ["MELI_APP_SECRET"],
              "refresh_token":os.environ["MELI_REFRESH_TOKEN_WILBERT"]},timeout=20).json()["access_token"]
          h={"Authorization":f"Bearer {tok}"}
          hj={**h,"Content-Type":"application/json"}
          SOURCES=["MLM5266046030","MLM5265893746","MLM5266032976","MLM5265868092","MLM5265906396"]
          for src in SOURCES:
              print(f"\n=== {src} ===")
              it=requests.get(f"{API}/items/{src}?include_attributes=all",headers=h).json()
              title=(it.get("title") or "")[:60]
              cpid=it.get("catalog_product_id")
              price=it.get("price",499)
              cat=it.get("category_id")
              cond=it.get("condition","new")
              lt=it.get("listing_type_id","gold_pro")

              attrs=[]
              for a in it.get("attributes",[]) or []:
                  if a.get("id") in ("BRAND","MODEL","COLOR","ITEM_CONDITION","DETAILED_MODEL","LINE","MODEL_NAME","MAIN_COLOR","FRAGRANCE_TYPE","ITEM_VOLUME","UNIT_VOLUME"):
                      v={"id":a["id"]}
                      if a.get("value_id"): v["value_id"]=a["value_id"]
                      if a.get("value_name"): v["value_name"]=a["value_name"]
                      attrs.append(v)
              if not any(x.get("id")=="GTIN" for x in attrs):
                  attrs.append({"id":"GTIN","value_name":"No aplica"})

              sale_terms=[]
              for st in it.get("sale_terms",[]) or []:
                  v={"id":st["id"]}
                  if st.get("value_id"): v["value_id"]=st["value_id"]
                  if st.get("value_name"): v["value_name"]=st["value_name"]
                  sale_terms.append(v)

              pics=[{"id":p["id"]} for p in (it.get("pictures") or []) if p.get("id")]
              shipping=it.get("shipping") or {"mode":"me2","free_shipping":True,"logistic_type":"xd_drop_off","local_pick_up":False}

              # POST nueva publicación INDEPENDIENTE — sin family_name, sin user_product_id
              body={
                "site_id":"MLM",
                "title": title,
                "category_id": cat,
                "price": price,
                "currency_id":"MXN",
                "available_quantity": 1,
                "buying_mode":"buy_it_now",
                "listing_type_id": lt,
                "condition": cond,
                "shipping": shipping,
                "pictures": pics,
                "attributes": attrs,
                "sale_terms": sale_terms,
              }
              if cpid:
                  body["catalog_product_id"]=cpid
                  body["catalog_listing"]=True
              print(f"  title='{title}' cat={cat} price={price} cpid={cpid} pics={len(pics)} attrs={len(attrs)} terms={len(sale_terms)}")
              r=requests.post(f"{API}/items",headers=hj,json=body,timeout=45)
              print(f"  POST: {r.status_code}")
              if r.status_code in (200,201):
                  new=r.json().get("id")
                  print(f"  *** NUEVO: {new} ***")
                  # description
                  desc=requests.get(f"{API}/items/{src}/description",headers=h,timeout=10)
                  desc_text="Producto 100% original y nuevo. Garantia del vendedor. Envio gratis."
                  if desc.status_code==200:
                      desc_text=(desc.json().get("plain_text") or desc_text)[:5000]
                  rd=requests.post(f"{API}/items/{new}/description",headers=hj,json={"plain_text":desc_text},timeout=15)
                  print(f"  description: {rd.status_code}")
              else:
                  print(f"  err: {r.text[:600]}")
              time.sleep(1)
          PY
