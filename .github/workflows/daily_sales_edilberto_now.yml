name: daily-sales-edilberto-now
on:
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests -q
      - name: Validate report
        run: python3 -m py_compile scripts/daily_sales_edilberto_now.py
      - name: Query today's Edilberto orders
        env:
          MELI_APP_ID_NEW: ${{ secrets.MELI_APP_ID_NEW }}
          MELI_APP_SECRET_NEW: ${{ secrets.MELI_APP_SECRET_NEW }}
          MELI_REFRESH_TOKEN_EDILBERTO: ${{ secrets.MELI_REFRESH_TOKEN_EDILBERTO }}
        run: python3 scripts/daily_sales_edilberto_now.py
      - name: Save rotated token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_SECRETS }}
        run: |
          if [ -s /tmp/edilberto_rotated_token ]; then
            gh secret set MELI_REFRESH_TOKEN_EDILBERTO --repo kxmwnzbzhn-spec/meli-autoresponder < /tmp/edilberto_rotated_token
          fi
