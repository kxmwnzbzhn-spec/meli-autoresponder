name: planb-rest-all
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
        run: |
          python3 - <<'PY'
          import os, requests, time, re
          API="https://api.mercadolibre.com"
          tok=requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
              "client_id":os.environ["MELI_APP_ID"],
              "client_secret":os.environ["MELI_APP_SECRET"],
              "refresh_token":os.environ["MELI_REFRESH_TOKEN_WILBERT"]},timeout=20).json()["access_token"]
          h={"Authorization":f"Bearer {tok}"}
          hj={**h,"Content-Type":"application/json"}
          UID=3367276814
          PERFUME_RX=re.compile(r"perfume|fragrance|edp|edt|eau de|cologne|alchemia|armaf|odyssey|colonia|lattafa|nova|maleka|club de nuit|spectra|delight|island|mandarin|aqua men|mega man|fruit",re.I)
          # Already republished (lote1 fix) - skip these
          ALREADY_REPUB=set(["MLM5287500034","MLM5287499028","MLM5287499008","MLM5287500734","MLM5287497362","MLM5287497338","MLM5287495728","MLM5287500058","MLM5287501100","MLM5287384768"])
          # Listar todos
          ids=[]; off=0
          while True:
              j=requests.get(f"{API}/users/{UID}/items/search?limit=50&offset={off}",headers=h,timeout=20).json()
              r=j.get("results",[]); ids+=r
              off+=50
              if off>=j.get("paging",{}).get("total",0) or not r: break
          print(f"Total: {len(ids)}")
          # Bulk
          items={}
          for i in range(0,len(ids),20):
              r=requests.get(f"{API}/items?ids={','.join(ids[i:i+20])}&attributes=id,title,status,sub_status,price,category_id,listing_type_id,condition,catalog_product_id,available_quantity",headers=h,timeout=25).json()
              for it in r:
                  if it.get("code")==200: items[it["body"]["id"]]=it["body"]
          # Filtrar bocinas (no perfume) y no ya republished
          to_process=[]
          for iid,b in items.items():
              t=b.get("title","")
              if PERFUME_RX.search(t): continue
              if iid in ALREADY_REPUB: continue
              # ignorar items closed que tengan sub_status que indique borrado por nosotros (ya estaban en limpieza previa)
              # procesar todos los no perfume no republicados
              to_process.append(iid)
          print(f"To process: {len(to_process)}")

          new_ok=0; new_err=0; close_ok=0; close_err=0
          for src in to_process:
              try:
                  it=requests.get(f"{API}/items/{src}?include_attributes=all",headers=h,timeout=20).json()
              except:
                  new_err+=1; continue
              if not it.get("title"):
                  new_err+=1; continue
              attrs=[]
              for a in it.get("attributes",[]) or []:
                  if a.get("id") in ("BRAND","MODEL","COLOR","ITEM_CONDITION","DETAILED_MODEL","MAIN_COLOR","ITEM_VOLUME"):
                      v={"id":a["id"]}
                      if a.get("value_id"): v["value_id"]=a["value_id"]
                      if a.get("value_name"): v["value_name"]=a["value_name"]
                      attrs.append(v)
              sale_terms=[]
              for st in it.get("sale_terms",[]) or []:
                  v={"id":st["id"]}
                  if st.get("value_id"): v["value_id"]=st["value_id"]
                  if st.get("value_name"): v["value_name"]=st["value_name"]
                  sale_terms.append(v)
              pics=[{"id":p["id"]} for p in (it.get("pictures") or []) if p.get("id")]
              shipping=it.get("shipping") or {"mode":"me2","free_shipping":True,"logistic_type":"xd_drop_off","local_pick_up":False}
              cpid=it.get("catalog_product_id")
              body={"site_id":"MLM","title":(it.get("title") or "")[:60],"category_id":it.get("category_id"),
                "price":it.get("price",499),"currency_id":"MXN","available_quantity":1,"buying_mode":"buy_it_now",
                "listing_type_id":it.get("listing_type_id","gold_pro"),"condition":it.get("condition","used"),
                "shipping":shipping,"pictures":pics,"attributes":attrs,"sale_terms":sale_terms}
              if cpid:
                  body["catalog_product_id"]=cpid; body["catalog_listing"]=True
              # POST nuevo
              rp=requests.post(f"{API}/items",headers=hj,json=body,timeout=45)
              if rp.status_code in (200,201):
                  new_ok+=1
                  new_id=rp.json().get("id")
                  print(f"  {src} → {new_id}")
              else:
                  new_err+=1
                  print(f"  ERR POST {src}: {rp.status_code} {rp.text[:200]}")
                  continue
              # Cerrar fuente (si no está ya closed)
              if it.get("status")!="closed":
                  rc=requests.put(f"{API}/items/{src}",headers=hj,json={"status":"closed"},timeout=15)
                  if rc.status_code in (200,201): close_ok+=1
                  else:
                      close_err+=1
                      print(f"    close ERR: {rc.status_code} {rc.text[:80]}")
              time.sleep(0.5)
          print(f"\n=== RESUMEN PLAN B (resto Wilbert) ===")
          print(f"  POST nuevo: {new_ok}/{len(to_process)}  err={new_err}")
          print(f"  Cerrados: {close_ok}  err_close={close_err}")
          PY
