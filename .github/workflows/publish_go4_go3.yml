name: publish-go4-go3
on: { workflow_dispatch: }
concurrency:
  group: stock-cfg-raymundo
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { token: '${{ secrets.PUSH_PAT || secrets.GITHUB_TOKEN }}' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests -q
      - env:
          MELI_APP_SECRET:              ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_RAYMUNDO:  ${{ secrets.MELI_REFRESH_TOKEN_RAYMUNDO }}
          TELEGRAM_BOT_TOKEN:           ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:             ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/publish_go4_go3.py
      - if: always()
        run: |
          git config user.name "publish-bot"
          git config user.email "publish@elitemarket"
          git add stock_config_raymundo.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "publish: 55 catálogos Go4+Go3 en Raymundo + reparto pool"
            for i in 1 2 3; do
              git pull --rebase --autostash origin main && git push origin main && break
              sleep 5
            done
          fi
