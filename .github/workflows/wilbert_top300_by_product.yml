name: wilbert-top300-by-product
on: { workflow_dispatch: }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get install -y poppler-utils
      - run: pip install requests pypdf reportlab openpyxl pdf2image Pillow -q
      - env:
          MELI_APP_SECRET:                ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_WILBERT:     ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
        run: python scripts/wilbert_top300_by_product.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wilbert-top300-by-product
          path: ETIQUETAS_WILBERT_TOP300_BY_PRODUCT.pdf
