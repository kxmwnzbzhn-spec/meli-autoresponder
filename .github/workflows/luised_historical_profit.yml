name: luised-historical-speaker-profit
on:
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests openpyxl -q
      - name: Run full accounting audit
        env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID_NEW }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET_NEW }}
          MELI_REFRESH_TOKEN_LUISED: ${{ secrets.MELI_REFRESH_TOKEN_LUISED }}
          ACCOUNTING_START_DATE: '2026-08-19'
          ACCOUNTING_OUTPUT: /tmp/luised_accounting.xlsx
        run: |
          curl -fsSL https://raw.githubusercontent.com/kxmwnzbzhn-spec/meli-autoresponder/main/scripts/accounting_rocioangel.py -o /tmp/acct.py
          python3 - <<'PY'
          p='/tmp/acct.py'
          s=open(p).read()
          s=s.replace('APP_ID = "2008666770714005"','APP_ID = os.environ["MELI_APP_ID"]')
          s=s.replace('REFRESH_TOKEN = os.environ["MELI_REFRESH_TOKEN_ROCIOANGEL"]','REFRESH_TOKEN = os.environ["MELI_REFRESH_TOKEN_LUISED"]')
          s=s.split('\ndef drive_service():')[0]
          open(p,'w').write(s)
          PY
          python /tmp/acct.py /tmp/luised_accounting.xlsx
      - name: Summarize verified totals
        run: |
          python3 - <<'PY'
          import json, openpyxl
          wb=openpyxl.load_workbook('/tmp/luised_accounting.xlsx',data_only=False)
          ws=wb['Ventas']; headers=[c.value for c in ws[1]]; idx={h:i for i,h in enumerate(headers)}
          gross=fees=ship=refund=costs=0.0; units=orders=0; returns=cancelled=0; reasons=set(); seen=set()
          def f(x):
            try:return float(x or 0)
