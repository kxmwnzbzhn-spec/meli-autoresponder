name: daily-etiquetas-unificadas
on:
  workflow_dispatch:
    inputs:
      force_regen:
        description: 'Borrar PDF de hoy y regenerar (anti-cache)'
        required: false
        type: string
        default: ''
      account_filter:
        description: 'Cuentas para esta ejecución; vacío conserva las cuentas diarias'
        required: false
        type: string
        default: ''
  schedule:
    - cron: '0 13 * * 1-6'  # 07:00 CDMX (UTC-6), lunes a sábado. Domingo bloqueado por guardia interna.
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Bloquear ejecución en domingo CDMX
        run: |
          if [ "$(TZ=America/Mexico_City date +%u)" = "7" ]; then
            echo "Domingo: no se generan ni suben etiquetas"
            exit 1
          fi
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install poppler
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install Python deps
        run: pip install requests pypdf reportlab pdf2image Pillow google-api-python-client google-auth google-auth-oauthlib -q
      - name: Run daily etiquetas
        env:
          FORCE_REGEN:                  ${{ inputs.force_regen }}
          ACCOUNT_FILTER:                ${{ inputs.account_filter || 'Asva,Edilberto,LuisEd,JorgeLuis' }}
          OUTPUT_PREFIX:                 'ETIQUETAS_UNIFICADAS'
          MELI_APP_ID:                  ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET:              ${{ secrets.MELI_APP_SECRET }}
          MELI_APP_ID_NEW:              ${{ secrets.MELI_APP_ID_NEW }}
          MELI_APP_SECRET_NEW:          ${{ secrets.MELI_APP_SECRET_NEW }}
          MELI_REFRESH_TOKEN_ASVA:      ${{ secrets.MELI_REFRESH_TOKEN_ASVA }}
          MELI_REFRESH_TOKEN_EDILBERTO: ${{ secrets.MELI_REFRESH_TOKEN_EDILBERTO }}
          MELI_REFRESH_TOKEN_LUISED:    ${{ secrets.MELI_REFRESH_TOKEN_LUISED }}
          MELI_REFRESH_TOKEN_JORGE_LUIS: ${{ secrets.MELI_REFRESH_TOKEN_JORGE_LUIS }}
          GOOGLE_SERVICE_ACCOUNT_JSON:  ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID:       ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET:   ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN:   ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN:           ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:             ${{ secrets.TELEGRAM_CHAT_ID }}
          DRIVE_FOLDER_ID:              '1aIDN3iq6zwCacL57iamptvQCPoSDyRbL'
        run: python scripts/daily_run.py
