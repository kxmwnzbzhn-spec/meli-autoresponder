name: react-2910457981-relist
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
        run: |
          python3 - <<'PY'
          import os, requests, time
          API="https://api.mercadolibre.com"
          tok=requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
              "client_id":os.environ["MELI_APP_ID"],
              "client_secret":os.environ["MELI_APP_SECRET"],
              "refresh_token":os.environ["MELI_REFRESH_TOKEN_WILBERT"]},timeout=20).json()["access_token"]
          h={"Authorization":f"Bearer {tok}"}
          hj={**h,"Content-Type":"application/json"}
          IID="MLM2910457981"
          # /relist requiere closed
          # Step 1: cerrar
          r1=requests.put(f"{API}/items/{IID}",headers=hj,json={"status":"closed"},timeout=15)
          print(f"close: {r1.status_code}")
          time.sleep(45)
          it=requests.get(f"{API}/items/{IID}",headers=h).json()
          print(f"after close: status={it.get('status')}")
          if it.get("status")=="closed":
              # Step 2: relist con price+quantity
              price=it.get("price",499)
              lt=it.get("listing_type_id","gold_pro")
              r2=requests.post(f"{API}/items/{IID}/relist",headers=hj,
                  json={"listing_type_id":lt,"price":price,"quantity":1},timeout=20)
              print(f"relist: {r2.status_code} {r2.text[:200]}")
          PY
