name: multi-action-wilbert
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
        run: |
          python3 - <<'PY'
          import os, requests
          API="https://api.mercadolibre.com"
          tok=requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
              "client_id":os.environ["MELI_APP_ID"],
              "client_secret":os.environ["MELI_APP_SECRET"],
              "refresh_token":os.environ["MELI_REFRESH_TOKEN_WILBERT"]},timeout=20).json()["access_token"]
          hj={"Authorization":f"Bearer {tok}","Content-Type":"application/json"}
          # Cerrar 2
          for iid in ("MLM2908818917","MLM5309531604"):
              r=requests.put(f"{API}/items/{iid}",headers=hj,json={"status":"closed"},timeout=15)
              print(f"close {iid}: {r.status_code} {r.text[:100] if r.status_code not in (200,201) else 'OK'}")
          # Stock 2908793357
          r=requests.put(f"{API}/items/MLM2908793357",headers=hj,json={"available_quantity":1,"status":"active"},timeout=15)
          print(f"MLM2908793357 qty=1 active: {r.status_code} {r.text[:120] if r.status_code not in (200,201) else 'OK'}")
          PY
