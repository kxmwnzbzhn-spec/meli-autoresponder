name: create-asva-flipi7-v3
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests -q
      - name: Create v3
        env:
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_ASVA: ${{ secrets.MELI_REFRESH_TOKEN_ASVA }}
        run: python scripts/create_asva_flipi7_v3.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asva_flipi7_v3_result
          path: asva_flipi7_v3_result.json
          if-no-files-found: warn
