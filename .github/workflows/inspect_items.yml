name: inspect-items-oneoff
on: { workflow_dispatch: {} }
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_DIDER: ${{ secrets.MELI_REFRESH_TOKEN_DIDER }}
        run: python scripts/inspect_items.py
      - if: always()
        env: { GH_TOKEN: "${{ secrets.GH_TOKEN_FOR_SECRETS }}" }
        run: |
          if [ -s /tmp/rot ]; then
            gh secret set MELI_REFRESH_TOKEN_DIDER --repo kxmwnzbzhn-spec/meli-autoresponder < /tmp/rot
          fi
