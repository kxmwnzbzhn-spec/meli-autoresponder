name: republish_trad_esoteric
on:
  workflow_dispatch:
jobs:
  r:
    runs-on: ubuntu-latest
    env:
      MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
      MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
      MELI_REFRESH_TOKEN_ASVA: ${{ secrets.MELI_REFRESH_TOKEN_ASVA }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python scripts/republish_trad_esoteric.py
