name: inspect-catalog
on:
  workflow_dispatch:
    inputs:
      cpid: { description: 'CPID (MLM...)', required: true, default: 'MLM65349937' }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests -q
      - env:
          CPID: ${{ github.event.inputs.cpid }}
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_AH: ${{ secrets.MELI_REFRESH_TOKEN_AH }}
        run: python3 scripts/inspect_catalog.py
