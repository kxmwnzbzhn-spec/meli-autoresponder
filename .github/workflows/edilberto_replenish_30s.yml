name: edilberto-replenish-30s
on:
  workflow_dispatch:
    inputs:
      duration_sec:
        description: 'Duración del monitor en segundos'
        required: false
        default: '19800'
  schedule:
    - cron: '23 6 * * *'

concurrency:
  group: edilberto-replenish-30s
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests -q
      - name: Safety tests
        run: |
          python3 -m unittest tests/test_stock_policy.py -v
          python3 -m py_compile scripts/stock_policy.py scripts/edilberto_replenish_30s.py
      - name: Monitor authorized Edilberto listings and catalog position
        env:
          MELI_APP_ID_NEW: ${{ secrets.MELI_APP_ID_NEW }}
          MELI_APP_SECRET_NEW: ${{ secrets.MELI_APP_SECRET_NEW }}
          MELI_REFRESH_TOKEN_EDILBERTO: ${{ secrets.MELI_REFRESH_TOKEN_EDILBERTO }}
          RUN_DURATION_SEC: ${{ inputs.duration_sec || '19800' }}
        run: python3 scripts/edilberto_replenish_30s.py
      - name: Save rotated refresh token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_SECRETS }}
        run: |
          if [ -s /tmp/edilberto_rotated_token ]; then
            gh secret set MELI_REFRESH_TOKEN_EDILBERTO --repo kxmwnzbzhn-spec/meli-autoresponder < /tmp/edilberto_rotated_token
          fi
      - name: Continue monitoring
        if: ${{ success() && (github.event_name == 'schedule' || inputs.duration_sec == '19800') }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_SECRETS }}
        run: gh workflow run edilberto_replenish_30s.yml --repo kxmwnzbzhn-spec/meli-autoresponder -f duration_sec=19800
