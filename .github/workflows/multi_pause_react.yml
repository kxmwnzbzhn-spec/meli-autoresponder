name: multi-pause-react-yiriam
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
          MELI_REFRESH_TOKEN_YC_NEW: ${{ secrets.MELI_REFRESH_TOKEN_YC_NEW }}
        run: |
          python3 - <<'PY'
          import os, requests, time
          API="https://api.mercadolibre.com"
          def tok(rt):
              return requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
                  "client_id":os.environ["MELI_APP_ID"],
                  "client_secret":os.environ["MELI_APP_SECRET"],
                  "refresh_token":rt},timeout=20).json().get("access_token")
          tw=tok(os.environ["MELI_REFRESH_TOKEN_WILBERT"])
          ty=tok(os.environ["MELI_REFRESH_TOKEN_YC_NEW"])
          hwj={"Authorization":f"Bearer {tw}","Content-Type":"application/json"}
          hyj={"Authorization":f"Bearer {ty}","Content-Type":"application/json"}
          # Pausar 2 Wilbert
          for iid in ("MLM2910806817","MLM2910457917"):
              r=requests.put(f"{API}/items/{iid}",headers=hwj,json={"status":"paused"},timeout=15)
              print(f"WILBERT pause {iid}: {r.status_code}")
          # Activar 2 Yiriam
          for iid in ("MLM5291785036","MLM5291772416"):
              r=requests.put(f"{API}/items/{iid}",headers=hyj,json={"status":"active","available_quantity":1},timeout=15)
              print(f"YIRIAM activate {iid}: {r.status_code}")
              if r.status_code not in (200,201):
                  r2=requests.put(f"{API}/items/{iid}",headers=hyj,json={"status":"active"},timeout=15)
                  print(f"  retry: {r2.status_code} {r2.text[:120]}")
          PY
