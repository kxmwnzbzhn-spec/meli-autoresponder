name: Stock Watch SPK35W
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - run: python scripts/stock_watch_spk35w.py
        env:
          MELI_APP_ID:                ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET:            ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_USER1668: ${{ secrets.MELI_REFRESH_TOKEN_USER1668 }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
          MELI_REFRESH_TOKEN_ASVA:    ${{ secrets.MELI_REFRESH_TOKEN_ASVA }}
