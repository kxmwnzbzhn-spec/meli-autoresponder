name: stock-watch-spk35w
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
concurrency:
  group: stock-watch-spk35w
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          TOKEN_SHARED: ${{ secrets.TOKEN_SHARED }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_USER1668: ${{ secrets.MELI_REFRESH_TOKEN_USER1668 }}
        run: python scripts/stock_watch_spk35w.py







