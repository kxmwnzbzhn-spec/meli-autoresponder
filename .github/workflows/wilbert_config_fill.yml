name: wilbert-config-fill
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { token: "${{ secrets.GITHUB_TOKEN }}" }
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
        run: |
          python3 - <<'PY'
          import os, requests, json
          API="https://api.mercadolibre.com"
          tok=requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
              "client_id":os.environ["MELI_APP_ID"],
              "client_secret":os.environ["MELI_APP_SECRET"],
              "refresh_token":os.environ["MELI_REFRESH_TOKEN_WILBERT"]},timeout=20).json()["access_token"]
          h={"Authorization":f"Bearer {tok}"}
          UID=3367276814
          cfg=json.load(open("stock_config_wilbert.json"))
          # Listar todos active+paused
          ids=[]
          for st in ("active","paused"):
              off=0
              while True:
                  j=requests.get(f"{API}/users/{UID}/items/search?status={st}&limit=50&offset={off}",headers=h,timeout=20).json()
                  r=j.get("results",[]); ids+=r
                  off+=50
                  if off>=j.get("paging",{}).get("total",0) or not r: break
          # Bulk
          items={}
          for i in range(0,len(ids),20):
              r=requests.get(f"{API}/items?ids={','.join(ids[i:i+20])}&attributes=id,title,available_quantity",headers=h,timeout=25).json()
              for it in r:
                  if it.get("code")==200: items[it["body"]["id"]]=it["body"]
          added=0
          for iid,b in items.items():
              if iid not in cfg:
                  cfg[iid]={
                    "title":(b.get("title") or "")[:80],
                    "min_visible":1,
                    "real_stock":10,
                    "master_stock":10,
                    "auto_replenish":True,
                    "active":True,
                  }
                  added+=1
          json.dump(cfg, open("stock_config_wilbert.json","w"), indent=2, ensure_ascii=False)
          print(f"Added {added} entries to config")
      - name: Commit
        run: |
          git config user.name bot
          git config user.email bot@local
          git add stock_config_wilbert.json
          git diff --cached --quiet || git commit -m "audit: add missing wilbert items to config (auto_replenish=True)"
          git push origin main
