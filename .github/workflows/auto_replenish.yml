name: auto-replenish-30s
on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/5 * * * *'
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests pynacl -q
      - name: replenish loop
        id: replenish
        env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_ASVA: ${{ secrets.MELI_REFRESH_TOKEN_ASVA }}
          MELI_REFRESH_TOKEN_BREN: ${{ secrets.MELI_REFRESH_TOKEN_BREN }}
          MELI_REFRESH_TOKEN_CLARIBEL: ${{ secrets.MELI_REFRESH_TOKEN_CLARIBEL }}
          MELI_REFRESH_TOKEN_DILCIE: ${{ secrets.MELI_REFRESH_TOKEN_DILCIE }}
          MELI_REFRESH_TOKEN_JUAN: ${{ secrets.MELI_REFRESH_TOKEN_JUAN }}
          MELI_REFRESH_TOKEN_RAYMUNDO: ${{ secrets.MELI_REFRESH_TOKEN_RAYMUNDO }}
          MELI_REFRESH_TOKEN_RMAYCHI: ${{ secrets.MELI_REFRESH_TOKEN_RMAYCHI }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
        run: |
          python3 scripts/auto_replenish.py | tee /tmp/replenish.log
          grep '^FINAL_ROTATED_TOKENS=' /tmp/replenish.log | sed 's/^FINAL_ROTATED_TOKENS=//' > /tmp/rotated.json || echo '{}' > /tmp/rotated.json
          cat /tmp/rotated.json
      - name: update secrets with rotated tokens
        env:
          GH_TOKEN_FOR_SECRETS: ${{ secrets.GH_TOKEN_FOR_SECRETS }}
        run: |
          if [ -z "$GH_TOKEN_FOR_SECRETS" ]; then
            echo "::warning::GH_TOKEN_FOR_SECRETS not set; skipping secret rotation (next run will fail with stale RT)"
            exit 0
          fi
          python3 - <<'PY'
          import os, json, base64, urllib.request, urllib.error
          from nacl import encoding, public
          OWNER="kxmwnzbzhn-spec"; REPO="meli-autoresponder"
          TOKEN=os.environ["GH_TOKEN_FOR_SECRETS"]
          rotated=json.load(open("/tmp/rotated.json"))
          if not rotated:
              print("no rotated tokens"); raise SystemExit(0)
          pk=json.loads(urllib.request.urlopen(urllib.request.Request(f"https://api.github.com/repos/{OWNER}/{REPO}/actions/secrets/public-key",headers={"Authorization":f"Bearer {TOKEN}","Accept":"application/vnd.github+json"})).read())
          for NAME,VAL in rotated.items():
              if not VAL: continue
              sealed=public.SealedBox(public.PublicKey(pk["key"].encode(), encoding.Base64Encoder())).encrypt(VAL.encode())
              req=urllib.request.Request(f"https://api.github.com/repos/{OWNER}/{REPO}/actions/secrets/{NAME}",
                  headers={"Authorization":f"Bearer {TOKEN}","Accept":"application/vnd.github+json","Content-Type":"application/json"},
                  method="PUT",data=json.dumps({"encrypted_value":base64.b64encode(sealed).decode(),"key_id":pk["key_id"]}).encode())
              try:
                  with urllib.request.urlopen(req) as r: print(f"{NAME}: HTTP {r.status}")
              except urllib.error.HTTPError as e: print(f"{NAME}: ERR {e.code}")
          PY
