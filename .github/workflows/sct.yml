name: create-table-psql
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client -qq
      - env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -c "CREATE TABLE IF NOT EXISTS meli_stock_capped (item_id text PRIMARY KEY, account text NOT NULL, visible_qty int NOT NULL DEFAULT 1, remaining int NOT NULL, original int NOT NULL, auto_pause_when_zero boolean NOT NULL DEFAULT true, notes text, created_at timestamptz NOT NULL DEFAULT now(), updated_at timestamptz NOT NULL DEFAULT now());"
          psql "$SUPABASE_DB_URL" -c "NOTIFY pgrst, 'reload schema';"
          psql "$SUPABASE_DB_URL" -c "\d meli_stock_capped"
