name: questions-responder
on:
  workflow_dispatch:
    inputs:
      send_answers:
        description: 'Enviar respuestas reales (false = simulacion segura)'
        required: true
        type: boolean
        default: false
concurrency:
  group: questions-responder
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions: { actions: write, contents: read }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests pynacl -q
      - name: safety tests
        run: |
          python3 -m unittest tests/test_question_policy.py -v
          python3 -m py_compile scripts/question_policy.py scripts/questions_responder.py
      - name: run responder
        env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEND_ANSWERS: ${{ inputs.send_answers }}
          MELI_REFRESH_TOKEN: ${{ secrets.MELI_REFRESH_TOKEN }}
          MELI_REFRESH_TOKEN_CLARIBEL: ${{ secrets.MELI_REFRESH_TOKEN_CLARIBEL }}
          MELI_REFRESH_TOKEN_ASVA: ${{ secrets.MELI_REFRESH_TOKEN_ASVA }}
          MELI_REFRESH_TOKEN_BREN: ${{ secrets.MELI_REFRESH_TOKEN_BREN }}
          MELI_REFRESH_TOKEN_JUAN: ${{ secrets.MELI_REFRESH_TOKEN_JUAN }}
          MELI_REFRESH_TOKEN_RAYMUNDO: ${{ secrets.MELI_REFRESH_TOKEN_RAYMUNDO }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
          MELI_REFRESH_TOKEN_AH: ${{ secrets.MELI_REFRESH_TOKEN_AH }}
          MELI_REFRESH_TOKEN_MAYRELY: ${{ secrets.MELI_REFRESH_TOKEN_MAYRELY }}
          MELI_REFRESH_TOKEN_YERALDIN: ${{ secrets.MELI_REFRESH_TOKEN_YERALDIN }}
          MELI_REFRESH_TOKEN_LUPITA: ${{ secrets.MELI_REFRESH_TOKEN_LUPITA }}
          MELI_REFRESH_TOKEN_KARIME: ${{ secrets.MELI_REFRESH_TOKEN_KARIME }}
          MELI_REFRESH_TOKEN_LIGIA: ${{ secrets.MELI_REFRESH_TOKEN_LIGIA }}
          MELI_REFRESH_TOKEN_LUISED: ${{ secrets.MELI_REFRESH_TOKEN_LUISED }}
          MELI_REFRESH_TOKEN_EDILBERTO: ${{ secrets.MELI_REFRESH_TOKEN_EDILBERTO }}
          GH_TOKEN_FOR_SECRETS: ${{ secrets.GH_TOKEN_FOR_SECRETS }}
        run: |
          set -o pipefail
          python3 scripts/questions_responder.py | tee /tmp/qr.log
          grep '^FINAL_ROTATED_TOKENS=' /tmp/qr.log | sed 's/^FINAL_ROTATED_TOKENS=//' > /tmp/rot.json || echo '{}' > /tmp/rot.json
      - name: sync rotated tokens
        if: always()
        env:
          GH_TOKEN_FOR_SECRETS: ${{ secrets.GH_TOKEN_FOR_SECRETS }}
        run: |
          if [ -z "$GH_TOKEN_FOR_SECRETS" ] || [ ! -s /tmp/rot.json ]; then exit 0; fi
          python3 - <<'PY'
          import os,json,base64,urllib.request
          from nacl import encoding, public
          R="kxmwnzbzhn-spec/meli-autoresponder"
          T=os.environ["GH_TOKEN_FOR_SECRETS"]
          rot=json.load(open("/tmp/rot.json"))
          if not rot: raise SystemExit(0)
          pk=json.loads(urllib.request.urlopen(urllib.request.Request(
              f"https://api.github.com/repos/{R}/actions/secrets/public-key",
              headers={"Authorization":f"Bearer {T}","Accept":"application/vnd.github+json"})).read())
          for N,V in rot.items():
              if not V: continue
              sealed=public.SealedBox(public.PublicKey(pk["key"].encode(),encoding.Base64Encoder())).encrypt(V.encode())
              req=urllib.request.Request(
                  f"https://api.github.com/repos/{R}/actions/secrets/{N}",
                  headers={"Authorization":f"Bearer {T}","Accept":"application/vnd.github+json","Content-Type":"application/json"},
                  method="PUT",
                  data=json.dumps({"encrypted_value":base64.b64encode(sealed).decode(),"key_id":pk["key_id"]}).encode())
              try:
                  with urllib.request.urlopen(req) as r: print(f"{N}: {r.status}")
              except Exception as e: print(f"{N}: err {e}")
          PY
