name: clone_asva_to_karime
on:
  workflow_dispatch:
jobs:
  c:
    runs-on: ubuntu-latest
    env:
      MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
      MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
      MELI_REFRESH_TOKEN_ASVA: ${{ secrets.MELI_REFRESH_TOKEN_ASVA }}
      MELI_REFRESH_TOKEN_KARIME: ${{ secrets.MELI_REFRESH_TOKEN_KARIME }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python scripts/clone_asva_to_karime.py
