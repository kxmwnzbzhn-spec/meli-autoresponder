name: yir-war-watchdog
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
concurrency:
  group: yir-war-watchdog
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Check + revive war
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # War
          LAST=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/war_yiriam_perfumes.yml/runs?per_page=1" \
            | python3 -c "import sys,json,datetime as dt; r=json.load(sys.stdin)['workflow_runs'][0]; t=dt.datetime.fromisoformat(r['created_at'].replace('Z','+00:00')); now=dt.datetime.now(dt.timezone.utc); print(int((now-t).total_seconds()))")
          echo "war last run age: ${LAST}s"
          if [ "$LAST" -gt 180 ]; then
            echo "WAR STALE → dispatching"
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/war_yiriam_perfumes.yml/dispatches" \
              -d '{"ref":"main"}' || true
          fi
          # Fast replenish
          LAST2=$(curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/yir_fast_replenish.yml/runs?per_page=1" \
            | python3 -c "import sys,json,datetime as dt; r=json.load(sys.stdin)['workflow_runs'][0]; t=dt.datetime.fromisoformat(r['created_at'].replace('Z','+00:00')); now=dt.datetime.now(dt.timezone.utc); print(int((now-t).total_seconds()))")
          echo "fast_replenish last run age: ${LAST2}s"
          if [ "$LAST2" -gt 180 ]; then
            echo "FAST STALE → dispatching"
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/yir_fast_replenish.yml/dispatches" \
              -d '{"ref":"main"}' || true
          fi
