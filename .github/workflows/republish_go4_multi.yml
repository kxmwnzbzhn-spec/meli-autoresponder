name: republish-go4-multi
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
        run: |
          python3 - <<'PY'
          import os, requests, time
          API="https://api.mercadolibre.com"
          tok=requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
              "client_id":os.environ["MELI_APP_ID"],
              "client_secret":os.environ["MELI_APP_SECRET"],
              "refresh_token":os.environ["MELI_REFRESH_TOKEN_WILBERT"]},timeout=20).json()["access_token"]
          h={"Authorization":f"Bearer {tok}"}
          hj={**h,"Content-Type":"application/json"}
          SRC="MLM2911242253"
          src=requests.get(f"{API}/items/{SRC}?include_attributes=all",headers=h,timeout=20).json()
          # Extraer attrs base sin COLOR
          attrs_base=[]
          for a in src.get("attributes",[]) or []:
              if a.get("id") in ("BRAND","MODEL","DETAILED_MODEL","ITEM_VOLUME","MODEL_NAME"):
                  v={"id":a["id"]}
                  if a.get("value_id"): v["value_id"]=a["value_id"]
                  if a.get("value_name"): v["value_name"]=a["value_name"]
                  attrs_base.append(v)
          attrs_base.append({"id":"ITEM_CONDITION","value_name":"Usado"})
          # Pictures globales
          pics=[{"id":p["id"]} for p in (src.get("pictures") or []) if p.get("id")]
          # Extraer colores fuente
          colors=[]
          for v in src.get("variations",[]) or []:
              for ac in v.get("attribute_combinations",[]) or []:
                  if (ac.get("name") or "").lower()=="color":
                      colors.append(ac.get("value_name")); break
          print(f"Colores fuente: {colors}")
          # Build new variations
          new_vars=[]
          for c in colors:
              new_vars.append({
                "attribute_combinations":[{"id":"COLOR","value_name":c}],
                "available_quantity":1,
                "price":299,
                "picture_ids":[p["id"] for p in pics][:6],
              })
          sale_terms=[{"id":"WARRANTY_TYPE","value_name":"Garantía del vendedor"},{"id":"WARRANTY_TIME","value_name":"30 días"}]
          # Title profesional sin "original/tipo/simil/genérica"
          TITLE="Bocina Bluetooth Portátil Go 4 IP67 OEM 1.1 Espejo"[:60]
          body={
            "site_id":"MLM",
            "title":TITLE,
            "category_id":src.get("category_id"),
            "price":299,
            "currency_id":"MXN",
            "buying_mode":"buy_it_now",
            "listing_type_id":src.get("listing_type_id","gold_pro"),
            "condition":"used",
            "shipping":{"mode":"me2","free_shipping":True,"logistic_type":"xd_drop_off","local_pick_up":False},
            "pictures":pics,
            "attributes":attrs_base,
            "sale_terms":sale_terms,
            "variations":new_vars,
          }
          r=requests.post(f"{API}/items",headers=hj,json=body,timeout=45)
          print(f"POST: {r.status_code}")
          if r.status_code in (200,201):
              new_id=r.json().get("id")
              print(f"*** NUEVO: {new_id} ***")
              # Description (misma OEM 1.1)
              DESC=("Bocina Bluetooth Portátil Go 4 - Calidad Espejo OEM 1.1\n\n"
                "Bocina compacta tipo Go 4 con sonido potente y bajos profundos. Fabricación equivalente, calidad OEM 1.1, acabado y materiales premium. Diseño ultra portátil, ideal para llevar a cualquier lugar.\n\n"
                "CARACTERÍSTICAS:\n- Bluetooth 5.3 con conexión estable y rango amplio\n- Sonido nítido con bajos profundos y agudos balanceados\n- Resistencia IP67: protegida contra polvo y sumergible en agua\n- Batería de larga duración para uso continuo\n- Carga rápida vía USB-C\n- Diseño ultra compacto, peso ligero\n- Cordón integrado para transporte\n\n"
                "IMPORTANTE: Este modelo opera como bocina Bluetooth estándar y NO es compatible con la app móvil JBL Portable ni con Auracast.\n\n"
                "COLORES DISPONIBLES: Azul, Rosa, Rojo, Camuflaje, Negro, Aqua. Selecciona tu color al agregar al carrito.\n\n"
                "GARANTÍA: 30 días del vendedor por defectos de fábrica comprobables con video. No cubre daños por agua excesiva, caídas o mal uso.\n\n"
                "ENVÍO: GRATIS con Mercado Envíos en todo México. Despacho en 24h hábiles desde nuestro almacén. Entrega estimada 2 a 5 días según zona. Producto verificado y probado antes del envío.\n\n"
                "PALABRAS CLAVE: bocina bluetooth portátil, Go 4, parlante portátil, altavoz Bluetooth, IP67, resistente al agua, bocina ultracompacta, bluetooth 5.3, parlante para fiesta, bocina recargable USB-C.")
              rd=requests.post(f"{API}/items/{new_id}/description",headers=hj,json={"plain_text":DESC},timeout=15)
              print(f"description: {rd.status_code}")
              # Cerrar fuente
              time.sleep(1)
              rc=requests.put(f"{API}/items/{SRC}",headers=hj,json={"status":"closed"},timeout=15)
              print(f"close {SRC}: {rc.status_code}")
              for v in r.json().get("variations",[]):
                  ac=v.get("attribute_combinations",[])
                  c=ac[0].get("value_name") if ac else ""
                  print(f"  var {v.get('id')} color={c} qty={v.get('available_quantity')}")
          else:
              print(r.text[:600])
          PY
