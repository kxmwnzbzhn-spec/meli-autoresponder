name: yiriam-labels
on: { workflow_dispatch: }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: sudo apt-get install -y poppler-utils
      - run: pip install requests pypdf reportlab openpyxl pdf2image Pillow -q
      - env:
          MELI_APP_SECRET:                ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_USER1668:    ${{ secrets.MELI_REFRESH_TOKEN_USER1668 }}
        run: python scripts/yiriam_labels.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: yiriam
          path: ETIQUETAS_YIRIAM.pdf
