name: extract_asva_active
on:
  workflow_dispatch:
jobs:
  e:
    runs-on: ubuntu-latest
    env:
      MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
      MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
      MELI_REFRESH_TOKEN_ASVA: ${{ secrets.MELI_REFRESH_TOKEN_ASVA }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python scripts/extract_asva_active.py
