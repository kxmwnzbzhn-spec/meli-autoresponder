name: react-2910457981
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
        run: |
          python3 - <<'PY'
          import os, requests
          API="https://api.mercadolibre.com"
          tok=requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
              "client_id":os.environ["MELI_APP_ID"],
              "client_secret":os.environ["MELI_APP_SECRET"],
              "refresh_token":os.environ["MELI_REFRESH_TOKEN_WILBERT"]},timeout=20).json()["access_token"]
          h={"Authorization":f"Bearer {tok}"}
          hj={**h,"Content-Type":"application/json"}
          IID="MLM2910457981"
          it=requests.get(f"{API}/items/{IID}",headers=h).json()
          print(f"Antes: status={it.get('status')} sub={it.get('sub_status')} qty={it.get('available_quantity')} title='{it.get('title','')[:55]}'")
          r=requests.put(f"{API}/items/{IID}",headers=hj,json={"status":"active","available_quantity":1},timeout=15)
          print(f"PUT active+qty1: {r.status_code} {r.text[:300] if r.status_code not in (200,201) else 'OK'}")
          if r.status_code not in (200,201):
              r2=requests.put(f"{API}/items/{IID}",headers=hj,json={"status":"active"},timeout=15)
              print(f"retry status: {r2.status_code} {r2.text[:200]}")
          PY
