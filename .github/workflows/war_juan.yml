name: war-juan
on:
  workflow_dispatch:
  schedule:
    - cron: '*/3 * * * *'
concurrency:
  group: war-juan
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests -q
      - env:
          MELI_APP_ID:          ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET:      ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN:   ${{ secrets.MELI_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/war_juan.py
      - name: Re-trigger SELF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 45
          curl -sL -X POST -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/war_juan.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "self-retrigger sent"
