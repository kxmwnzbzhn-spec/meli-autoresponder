name: yiriam-tokentest
on: { workflow_dispatch: }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests -q
      - env:
          MELI_APP_ID_NEW:                ${{ secrets.MELI_APP_ID_NEW }}
          MELI_APP_SECRET_NEW:            ${{ secrets.MELI_APP_SECRET_NEW }}
          MELI_REFRESH_TOKEN_YC_NEW:      ${{ secrets.MELI_REFRESH_TOKEN_YC_NEW }}
        run: python scripts/yiriam_tokentest.py
