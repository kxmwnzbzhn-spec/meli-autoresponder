name: exchange-code
on:
  workflow_dispatch:
    inputs:
      code:
        description: "OAuth code TG-xxx"
        required: true
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          CODE: ${{ inputs.code }}
        run: python3 scripts/exchange.py
