name: daily-net-sales-three-accounts-now
on:
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests -q
      - run: python3 -m py_compile scripts/daily_net_sales_three_accounts_now.py
      - name: Query exact payment net
        env:
          MELI_APP_ID_NEW: ${{ secrets.MELI_APP_ID_NEW }}
          MELI_APP_SECRET_NEW: ${{ secrets.MELI_APP_SECRET_NEW }}
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_LUISED: ${{ secrets.MELI_REFRESH_TOKEN_LUISED }}
          MELI_REFRESH_TOKEN_EDILBERTO: ${{ secrets.MELI_REFRESH_TOKEN_EDILBERTO }}
          MELI_REFRESH_TOKEN_ASVA: ${{ secrets.MELI_REFRESH_TOKEN_ASVA }}
        run: python3 scripts/daily_net_sales_three_accounts_now.py
      - name: Save rotated tokens
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_SECRETS }}
        run: |
          for pair in "LUISED:/tmp/luised_rotated_token" "EDILBERTO:/tmp/edilberto_rotated_token" "ASVA:/tmp/asva_rotated_token"; do
            name="${pair%%:*}"; file="${pair#*:}"
            if [ -s "$file" ]; then gh secret set "MELI_REFRESH_TOKEN_$name" --repo kxmwnzbzhn-spec/meli-autoresponder < "$file"; fi
          done
