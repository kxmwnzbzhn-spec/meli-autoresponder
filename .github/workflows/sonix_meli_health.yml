name: Sonix Meli Health (cada 30 min)

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write    # to commit state file
  issues: write      # to open alert issues

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install requests

      - name: Run health check
        env:
          META_ADS_TOKEN: ${{ secrets.META_ADS_TOKEN }}
          META_CAPI_ACCESS_TOKEN: ${{ secrets.META_CAPI_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/sonix_meli_health.py
        continue-on-error: true

      - name: Commit state file
        run: |
          git config --global user.name 'sonix-monitor'
          git config --global user.email 'monitor@sonix.local'
          git add .sonix-meli-state.json || true
          if ! git diff --staged --quiet; then
            git commit -m "meli-health: state update $(date -u +%H:%M)"
            git push
          fi
