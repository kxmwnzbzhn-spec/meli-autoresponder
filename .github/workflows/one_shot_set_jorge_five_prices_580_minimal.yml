name: one-shot-set-jorge-five-prices-580-minimal
on:
  push:
    paths:
      - ".github/workflows/one_shot_set_jorge_five_prices_580_minimal.yml"
concurrency:
  group: one-shot-set-jorge-five-prices-580
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests -q
      - run: python3 -m py_compile scripts/set_jorge_prices_580.py
      - name: Set and verify exact prices
        env:
          MELI_APP_ID_NEW: ${{ secrets.MELI_APP_ID_NEW }}
          MELI_APP_SECRET_NEW: ${{ secrets.MELI_APP_SECRET_NEW }}
          MELI_REFRESH_TOKEN_JORGE_LUIS: ${{ secrets.MELI_REFRESH_TOKEN_JORGE_LUIS }}
        run: python3 scripts/set_jorge_prices_580.py
      - name: Save rotated token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_SECRETS }}
        run: |
          if [ -s /tmp/jorge_luis_rotated_token ]; then
            gh secret set MELI_REFRESH_TOKEN_JORGE_LUIS --repo kxmwnzbzhn-spec/meli-autoresponder < /tmp/jorge_luis_rotated_token
          fi
