name: apply-promo-549
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
        run: |
          python3 - <<'PY'
          import os, requests, math
          API="https://api.mercadolibre.com"
          tok=requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
              "client_id":os.environ["MELI_APP_ID"],
              "client_secret":os.environ["MELI_APP_SECRET"],
              "refresh_token":os.environ["MELI_REFRESH_TOKEN_WILBERT"]},timeout=20).json()["access_token"]
          h={"Authorization":f"Bearer {tok}"}
          hj={**h,"Content-Type":"application/json"}
          UID=3367276814
          # Listar promociones disponibles del seller
          print("=== Promotions disponibles ===")
          for pp in (1,2):
              prs=requests.get(f"{API}/seller-promotions/promotions/search?seller_id={UID}&app_version=v2&limit=20",headers=h,timeout=15).json()
              if prs.get("results"):
                  for p in prs["results"][:10]:
                      print(f"  {p.get('id')}  type={p.get('type')}  status={p.get('status')}  name={p.get('name','')[:40]}")
              break
          TARGET=549
          for iid in ("MLM2910457917","MLM2910880717","MLM2910806817"):
              print(f"\n=== {iid} ===")
              it=requests.get(f"{API}/items/{iid}",headers=h).json()
              cur=it.get("price",0) or 0
              if cur<=TARGET:
                  print(f"  precio actual ${cur} <= ${TARGET}, no aplica promo")
                  continue
              pct=round((1-(TARGET/cur))*100,2)
              print(f"  precio actual=${cur} → target=${TARGET}  pct={pct}%")
              # Probar promociones aplicables al item específico
              ip=requests.get(f"{API}/seller-promotions/items/{iid}?app_version=v2",headers=h,timeout=15).json()
              avail=ip if isinstance(ip,list) else []
              print(f"  promos elegibles para item: {len(avail)}")
              for p in (avail[:5] if avail else []):
                  print(f"    {p.get('id')} {p.get('type')} {p.get('status')}")
              # Variant 1: POST /seller-promotions/items con PRICE_DISCOUNT (seller-driven)
              body={"promotion_id":None,"promotion_type":"PRICE_DISCOUNT",
                "offer_type":"PRICE_DISCOUNT","id":iid,"deal_price":TARGET}
              r=requests.post(f"{API}/seller-promotions/items?app_version=v2",headers=hj,json=body,timeout=20)
              print(f"  POST PRICE_DISCOUNT: {r.status_code} {r.text[:200]}")
              if r.status_code in (200,201): continue
              # Variant 2: PUT por item
              body2={"promotion_type":"PRICE_DISCOUNT","offer_type":"PRICE_DISCOUNT","deal_price":TARGET}
              r2=requests.put(f"{API}/seller-promotions/items/{iid}?app_version=v2",headers=hj,json=body2,timeout=20)
              print(f"  PUT: {r2.status_code} {r2.text[:200]}")
              if r2.status_code in (200,201): continue
              # Variant 3: PERCENT_DISCOUNT
              body3={"promotion_type":"PRICE_DISCOUNT","offer_type":"PERCENT_DISCOUNT","percentage":pct,"id":iid}
              r3=requests.post(f"{API}/seller-promotions/items?app_version=v2",headers=hj,json=body3,timeout=20)
              print(f"  PERCENT: {r3.status_code} {r3.text[:200]}")
          PY
