name: Copy Meli secrets to tal-engine

on:
  workflow_dispatch:

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Install PyNaCl
        run: pip install pynacl requests
      - name: Copy secrets
        env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_ASVA: ${{ secrets.MELI_REFRESH_TOKEN_ASVA }}
          TARGET_GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_SECRETS }}
        run: |
          python3 <<'PY'
          import os, json, base64, urllib.request
          from nacl import encoding, public
          TARGET_OWNER = "kxmwnzbzhn-spec"
          TARGET_REPO = "tal-engine"
          TOKEN = os.environ["TARGET_GH_TOKEN"]
          H = {"Authorization": f"Bearer {TOKEN}", "Accept": "application/vnd.github+json"}
          # Public key
          r = urllib.request.Request(f"https://api.github.com/repos/{TARGET_OWNER}/{TARGET_REPO}/actions/secrets/public-key", headers=H)
          with urllib.request.urlopen(r, timeout=10) as resp:
              pk = json.loads(resp.read())
          pub = public.PublicKey(pk["key"].encode("utf-8"), encoding.Base64Encoder())
          box = public.SealedBox(pub)
          secrets_to_copy = {
              "MELI_APP_ID": os.environ["MELI_APP_ID"],
              "MELI_APP_SECRET": os.environ["MELI_APP_SECRET"],
              "MELI_REFRESH_TOKEN_ASVA": os.environ["MELI_REFRESH_TOKEN_ASVA"],
              "MELI_SELLER_ID_ASVA": "1668713481",  # from CLAUDE.md
          }
          for name, value in secrets_to_copy.items():
              enc = base64.b64encode(box.encrypt(value.encode())).decode()
              body = json.dumps({"encrypted_value": enc, "key_id": pk["key_id"]}).encode()
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{TARGET_OWNER}/{TARGET_REPO}/actions/secrets/{name}",
                  headers={**H, "Content-Type": "application/json"}, data=body, method="PUT")
              with urllib.request.urlopen(req, timeout=15) as resp:
                  print(f"  {name}: status {resp.status}")
          print("Done.")
          PY
