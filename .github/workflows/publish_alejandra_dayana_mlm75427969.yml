name: Publicar catálogo Alejandra Dayana MLM75427969
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publicar catálogo
        env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN: ${{ secrets.MELI_REFRESH_TOKEN_ALEJANDRA_DAYANA }}
        run: |
          python - <<'PY'
          import json, os, requests
          api = "https://api.mercadolibre.com"
          token = requests.post(api + "/oauth/token", data={
              "grant_type":"refresh_token", "client_id":os.environ["MELI_APP_ID"],
              "client_secret":os.environ["MELI_APP_SECRET"], "refresh_token":os.environ["MELI_REFRESH_TOKEN"]
          }, timeout=30)
          token.raise_for_status(); tj=token.json(); access=tj["access_token"]
          open("/tmp/alejandra_dayana_rotated","w").write(tj.get("refresh_token",""))
          h={"Authorization":"Bearer "+access}; hj={**h,"Content-Type":"application/json"}
          me=requests.get(api+"/users/me",headers=h,timeout=30); me.raise_for_status()
          if me.json()["id"] != 3658456705: raise RuntimeError("La credencial no corresponde a Alejandra Dayana")
          body={
            "site_id":"MLM",
            "category_id":"MLM59800",
            "price":99,"currency_id":"MXN","available_quantity":1,
            "buying_mode":"buy_it_now","listing_type_id":"gold_special","condition":"new",
            "catalog_product_id":"MLM75427969","catalog_listing":True,
            "shipping":{"mode":"me2"},
            "attributes":[{"id":"SELLER_SKU","value_name":"AD-FLIPI7-NEGRO"}]
          }
          r=requests.post(api+"/items",headers=hj,json=body,timeout=30)
          if r.status_code not in (200,201): raise RuntimeError(f"Publicación rechazada HTTP {r.status_code}: {r.text[:1500]}")
          item=r.json(); print(json.dumps({k:item.get(k) for k in ("id","status","price","available_quantity","catalog_product_id","permalink")},ensure_ascii=False))
          PY
      - name: Guardar token rotado
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_SECRETS }}
        run: |
          if [ -s /tmp/alejandra_dayana_rotated ]; then
            gh secret set MELI_REFRESH_TOKEN_ALEJANDRA_DAYANA --repo kxmwnzbzhn-spec/meli-autoresponder < /tmp/alejandra_dayana_rotated
          fi
