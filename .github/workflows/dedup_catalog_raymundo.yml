name: dedup-catalog-raymundo
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = dry run (no cerrar), 0 = ejecutar"
        default: "0"
concurrency:
  group: war-raymundo
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests -q
      - env:
          MELI_APP_SECRET:              ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_RAYMUNDO:  ${{ secrets.MELI_REFRESH_TOKEN_RAYMUNDO }}
          TELEGRAM_BOT_TOKEN:           ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:             ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN:                      ${{ github.event.inputs.dry_run }}
        run: python scripts/dedup_catalog_raymundo.py
