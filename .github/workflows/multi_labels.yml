name: multi-labels
on: { workflow_dispatch: {} }
jobs:
  r:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests pypdf reportlab -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_APP_ID_NEW: ${{ secrets.MELI_APP_ID_NEW }}
          MELI_APP_SECRET_NEW: ${{ secrets.MELI_APP_SECRET_NEW }}
          MELI_REFRESH_TOKEN_ALE: ${{ secrets.MELI_REFRESH_TOKEN_ALE }}
          MELI_REFRESH_TOKEN_DIDER: ${{ secrets.MELI_REFRESH_TOKEN_DIDER }}
          MELI_REFRESH_TOKEN_ASVA: ${{ secrets.MELI_REFRESH_TOKEN_ASVA }}
        run: python scripts/multi_labels.py
      - if: always()
        env: { GH_TOKEN: "${{ secrets.GH_TOKEN_FOR_SECRETS }}" }
        run: |
          for env in MELI_REFRESH_TOKEN_ALE MELI_REFRESH_TOKEN_DIDER MELI_REFRESH_TOKEN_ASVA; do
            if [ -s /tmp/rot_$env ]; then
              gh secret set $env --repo kxmwnzbzhn-spec/meli-autoresponder < /tmp/rot_$env
            fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: multi-labels
          path: |
            ETIQUETAS_CONSOLIDADO.pdf
            MANIFEST_CONSOLIDADO.json
          retention-days: 3
