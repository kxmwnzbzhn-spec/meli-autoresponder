name: claribel-diag
on: { workflow_dispatch: {} }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests -q
      - env:
          AID: ${{ secrets.MELI_APP_ID }}
          ASEC: ${{ secrets.MELI_APP_SECRET }}
          RT:  ${{ secrets.MELI_REFRESH_TOKEN_CLARIBEL }}
        run: |
          python - <<'EOF'
          import os, requests
          r = requests.post("https://api.mercadolibre.com/oauth/token", data={
            "grant_type":"refresh_token","client_id":os.environ["AID"],
            "client_secret":os.environ["ASEC"],"refresh_token":os.environ["RT"]}).json()
          at = r["access_token"]
          me = requests.get("https://api.mercadolibre.com/users/me", headers={"Authorization":f"Bearer {at}"}).json()
          print(f"UID={me.get('id')}")
          print(f"NICK={me.get('nickname')}")
          EOF
