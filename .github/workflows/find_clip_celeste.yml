name: find-clip-celeste
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_YC_NEW: ${{ secrets.MELI_REFRESH_TOKEN_YC_NEW }}
        run: |
          python3 - <<'PY'
          import os, requests, re
          API="https://api.mercadolibre.com"
          tok=requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
              "client_id":os.environ["MELI_APP_ID"],
              "client_secret":os.environ["MELI_APP_SECRET"],
              "refresh_token":os.environ["MELI_REFRESH_TOKEN_YC_NEW"]},timeout=20).json()["access_token"]
          h={"Authorization":f"Bearer {tok}"}
          UID=3364413125
          ids=[]; off=0
          while True:
              j=requests.get(f"{API}/users/{UID}/items/search?limit=50&offset={off}",headers=h,timeout=20).json()
              r=j.get("results",[]); ids+=r
              off+=50
              if off>=j.get("paging",{}).get("total",0) or not r: break
          items={}
          for i in range(0,len(ids),20):
              r=requests.get(f"{API}/items?ids={','.join(ids[i:i+20])}&attributes=id,title,status,price",headers=h,timeout=20).json()
              for it in r:
                  if it.get("code")==200: items[it["body"]["id"]]=it["body"]
          # Buscar "Clip 5" + (celeste o azul)
          for iid,b in items.items():
              t=(b.get("title") or "").lower()
              if "clip 5" in t and ("celeste" in t or "azul" in t):
                  print(f"  {iid} status={b.get('status')} price=${b.get('price')} title='{b.get('title','')[:60]}'")
          PY
