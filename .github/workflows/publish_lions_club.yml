name: publish-lions-club
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
        run: |
          python3 - <<'PY'
          import os, requests
          API="https://api.mercadolibre.com"
          tok=requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
              "client_id":os.environ["MELI_APP_ID"],
              "client_secret":os.environ["MELI_APP_SECRET"],
              "refresh_token":os.environ["MELI_REFRESH_TOKEN_WILBERT"]},timeout=20).json()["access_token"]
          h={"Authorization":f"Bearer {tok}"}
          hj={**h,"Content-Type":"application/json"}
          UP="MLMU3068811556"
          d=requests.get(f"{API}/user-products/{UP}",headers=h,timeout=15).json()
          print(f"UP info: name={d.get('name')} family={d.get('family_name')} domain={d.get('domain_id')}")
          family_name=d.get("name") or d.get("family_name") or "Armaf The Lion's Club Rugir 100ml EDP"
          # Buscar items relacionados via search por nombre para sacar category
          rs=requests.get(f"{API}/sites/MLM/search?q=Armaf+Lions+Club+Rugir+100ml&limit=5",headers=h,timeout=15).json()
          cat=(rs.get("results") or [{}])[0].get("category_id","MLM1271")
          pics=[{"id":p.get("id")} for p in (d.get("pictures") or []) if p.get("id")][:10]
          # Sin title (cuando hay family_name MELI rechaza title)
          # SIN GTIN (perfumes con UP suelen rechazar GTIN custom)
          body={
            "site_id":"MLM",
            "family_name":family_name,
            "category_id":cat,
            "price":699,
            "currency_id":"MXN",
            "available_quantity":1,
            "buying_mode":"buy_it_now",
            "listing_type_id":"gold_pro",
            "condition":"new",
            "shipping":{"mode":"me2","free_shipping":True,"logistic_type":"xd_drop_off","local_pick_up":False},
            "pictures":pics,
            "attributes":[{"id":"BRAND","value_name":"Armaf"}],
            "sale_terms":[{"id":"WARRANTY_TYPE","value_name":"Garantía del vendedor"},{"id":"WARRANTY_TIME","value_name":"30 días"}],
          }
          print(f"family_name='{family_name}' cat={cat}")
          r=requests.post(f"{API}/items",headers=hj,json=body,timeout=45)
          print(f"POST: {r.status_code}")
          if r.status_code in (200,201):
              print(f"*** NUEVO: {r.json().get('id')} ***")
          else:
              print(r.text[:600])
          PY
