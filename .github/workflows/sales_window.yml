name: sales-window
on:
  workflow_dispatch:
    inputs:
      from_iso:
        description: 'Desde (ISO con offset, ej 2026-05-01T07:00:00-06:00)'
        required: true
      to_iso:
        description: 'Hasta'
        required: true
      label:
        description: 'Label para el mensaje'
        required: false
        default: 'Ventana custom'
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN: ${{ secrets.MELI_REFRESH_TOKEN }}
          MELI_REFRESH_TOKEN_CLARIBEL: ${{ secrets.MELI_REFRESH_TOKEN_CLARIBEL }}
          MELI_REFRESH_TOKEN_ASVA: ${{ secrets.MELI_REFRESH_TOKEN_ASVA }}
          MELI_REFRESH_TOKEN_RAYMUNDO: ${{ secrets.MELI_REFRESH_TOKEN_RAYMUNDO }}
          MELI_REFRESH_TOKEN_DILCIE: ${{ secrets.MELI_REFRESH_TOKEN_DILCIE }}
          MELI_REFRESH_TOKEN_MILDRED: ${{ secrets.MELI_REFRESH_TOKEN_MILDRED }}
          MELI_REFRESH_TOKEN_YC_NEW: ${{ secrets.MELI_REFRESH_TOKEN_YC_NEW }}
          MELI_REFRESH_TOKEN_BREN: ${{ secrets.MELI_REFRESH_TOKEN_BREN }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FROM_ISO: ${{ inputs.from_iso }}
          TO_ISO: ${{ inputs.to_iso }}
          LABEL: ${{ inputs.label }}
        run: |
          python3 - <<'PY'
          import os, requests
          API="https://api.mercadolibre.com"
          ACCOUNTS = {
            "JUAN": "MELI_REFRESH_TOKEN",
            "CLARIBEL": "MELI_REFRESH_TOKEN_CLARIBEL",
            "ASVA": "MELI_REFRESH_TOKEN_ASVA",
            "RAYMUNDO": "MELI_REFRESH_TOKEN_RAYMUNDO",
            "DILCIE": "MELI_REFRESH_TOKEN_DILCIE",
            "MILDRED": "MELI_REFRESH_TOKEN_MILDRED",
            "YC_NEW": "MELI_REFRESH_TOKEN_YC_NEW",
            "BREN": "MELI_REFRESH_TOKEN_BREN",
            "WILBERT": "MELI_REFRESH_TOKEN_WILBERT",
          }
          frm = os.environ["FROM_ISO"]; to = os.environ["TO_ISO"]
          # MELI espera formato 2026-05-01T07:00:00.000-06:00
          def fmt(s):
              if "." not in s.split("T")[1].split("-")[0]:
                  # insert .000 before timezone
                  if s[-6] in "+-":
                      return s[:-6] + ".000" + s[-6:]
              return s
          frm_meli = fmt(frm); to_meli = fmt(to)
          totals = {"orders":0,"units":0,"revenue":0}
          per_account = {}
          for acc, env_key in ACCOUNTS.items():
              rt = os.environ.get(env_key)
              if not rt:
                  print(f"[{acc}] sin token, skip"); continue
              try:
                  r = requests.post(f"{API}/oauth/token", data={
                      "grant_type":"refresh_token",
                      "client_id":os.environ["MELI_APP_ID"],
                      "client_secret":os.environ["MELI_APP_SECRET"],
                      "refresh_token":rt
                  }, timeout=15).json()
                  tok = r.get("access_token"); uid = r.get("user_id")
                  if not tok:
                      print(f"[{acc}] oauth fail: {r}"); continue
                  h = {"Authorization": f"Bearer {tok}"}
                  total_orders = total_units = 0
                  total_revenue = 0.0
                  off = 0
                  while True:
                      url = f"{API}/orders/search?seller={uid}&order.date_created.from={frm_meli}&order.date_created.to={to_meli}&offset={off}&limit=50&sort=date_desc"
                      j = requests.get(url, headers=h, timeout=20).json()
                      results = j.get("results", [])
                      if not results: break
                      for o in results:
                          total_orders += 1
                          total_revenue += o.get("total_amount", 0) or 0
                          for it in o.get("order_items", []):
                              total_units += it.get("quantity", 0) or 0
                      if len(results) < 50: break
                      off += 50
                      if off > 2000: break
                  per_account[acc] = {"orders":total_orders, "units":total_units, "revenue":total_revenue}
                  totals["orders"] += total_orders; totals["units"] += total_units; totals["revenue"] += total_revenue
                  print(f"[{acc}] {total_orders} ord / {total_units} u / ${total_revenue:.0f}")
              except Exception as e:
                  print(f"[{acc}] ERROR {e}")
          print(f"\nTOTAL: {totals['orders']} ord / {totals['units']} u / ${totals['revenue']:.0f}")
          # Telegram
          tg_t = os.environ.get("TELEGRAM_BOT_TOKEN"); tg_c = os.environ.get("TELEGRAM_CHAT_ID")
          if tg_t and tg_c:
              lines = [f"📊 <b>{os.environ.get('LABEL','Ventas')}</b>", f"<i>{frm[:16]} → {to[:16]}</i>", ""]
              for acc, dd in sorted(per_account.items(), key=lambda x:-x[1]["revenue"]):
                  if dd["orders"] > 0:
                      lines.append(f"• {acc}: {dd['orders']} ord / {dd['units']} u / <b>${dd['revenue']:,.0f}</b>")
              lines.append("")
              lines.append(f"<b>TOTAL:</b> {totals['orders']} órdenes / {totals['units']} u / <b>${totals['revenue']:,.0f}</b>")
              requests.post(f"https://api.telegram.org/bot{tg_t}/sendMessage",
                  data={"chat_id":tg_c, "text":"\n".join(lines), "parse_mode":"HTML"}, timeout=10)
              print("TG sent")
          PY
