name: temp-list-rocio-go45
on:
  push:
    paths:
      - 'scripts/temp_list_rocio_go45.py'
  workflow_dispatch: {}

jobs:
  query:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests -q
      - name: Query Rocio catalog read-only
        env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_ROCIOANGEL: ${{ secrets.MELI_REFRESH_TOKEN_ROCIOANGEL }}
        run: python3 scripts/temp_list_rocio_go45.py
      - name: Save rotated refresh token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_SECRETS }}
        run: |
          if [ -s /tmp/rocio_rotated_token ]; then
            gh secret set MELI_REFRESH_TOKEN_ROCIOANGEL --repo kxmwnzbzhn-spec/meli-autoresponder < /tmp/rocio_rotated_token
          fi
