name: fix-pics-go4-multi-v2
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN: ${{ secrets.MELI_REFRESH_TOKEN }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
        run: |
          python3 - <<'PY'
          import os, requests, time
          API="https://api.mercadolibre.com"
          def tok(rt):
              return requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
                  "client_id":os.environ["MELI_APP_ID"],
                  "client_secret":os.environ["MELI_APP_SECRET"],
                  "refresh_token":rt},timeout=20).json().get("access_token")
          tj=tok(os.environ["MELI_REFRESH_TOKEN"])
          tw=tok(os.environ["MELI_REFRESH_TOKEN_WILBERT"])
          hj={"Authorization":f"Bearer {tj}"}
          hw_auth={"Authorization":f"Bearer {tw}"}
          hwj={**hw_auth,"Content-Type":"application/json"}
          IID="MLM5300550156"
          # Source
          src=requests.get(f"{API}/items/MLM5244765752?include_attributes=all",headers=hj,timeout=20).json()
          src_pics_meta={}
          for v in src.get("variations",[]) or []:
              col=""
              for ac in v.get("attribute_combinations",[]) or []:
                  if (ac.get("name") or "").lower()=="color":
                      col=ac.get("value_name"); break
              urls=[]
              for p in (v.get("pictures") or []):
                  if p.get("url"): urls.append(p["url"])
              if col: src_pics_meta[col]=urls[:4]
          print("URLs por color:")
          for c,u in src_pics_meta.items(): print(f"  {c}: {len(u)}")
          # Para cada URL, descargar e subir a Wilbert via multipart
          new_pics={}
          for col, urls in src_pics_meta.items():
              new_pics[col]=[]
              for url in urls:
                  try:
                      img=requests.get(url,timeout=20).content
                      if len(img)<2000: continue
                      r=requests.post(f"{API}/pictures",headers=hw_auth,
                        files={"file":(f"{col}.jpg",img,"image/jpeg")},timeout=45)
                      if r.status_code in (200,201):
                          pid=r.json().get("id")
                          if pid: new_pics[col].append(pid)
                  except Exception as e:
                      print(f"  err upload {col}: {e}")
              print(f"  {col}: {len(new_pics[col])} pics uploaded")
              time.sleep(0.3)
          # Actualizar variations
          target=requests.get(f"{API}/items/{IID}?include_attributes=all",headers=hw_auth,timeout=20).json()
          out_vars=[]
          for v in target.get("variations",[]) or []:
              col=""
              for ac in v.get("attribute_combinations",[]) or []:
                  if (ac.get("name") or "").lower()=="color":
                      col=ac.get("value_name"); break
              vd={"id":v["id"],"price":v.get("price"),"available_quantity":v.get("available_quantity",1),
                  "attribute_combinations":v.get("attribute_combinations",[])}
              if new_pics.get(col):
                  vd["picture_ids"]=new_pics[col]
              out_vars.append(vd)
          # Pics globales = todas
          all_pics=list({pid for pids in new_pics.values() for pid in pids})
          existing=[p["id"] for p in (target.get("pictures") or []) if p.get("id")]
          for pid in all_pics:
              if pid not in existing: existing.append(pid)
          existing=existing[:12]
          body={"pictures":[{"id":p} for p in existing],"variations":out_vars}
          r=requests.put(f"{API}/items/{IID}",headers=hwj,json=body,timeout=30)
          print(f"\nPUT: {r.status_code}")
          if r.status_code in (200,201):
              for v in r.json().get("variations",[]):
                  ac=v.get("attribute_combinations",[])
                  c=ac[0].get("value_name") if ac else ""
                  pids=v.get("picture_ids",[])
                  print(f"  {c}: {len(pids)} pics specific={pids[:1]}")
          else:
              print(r.text[:500])
          PY
