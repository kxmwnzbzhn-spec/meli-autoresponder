name: Autostock Alejandra infinito activo
on:
  push:
    paths:
      - '.github/workflows/autostock_ale_unlimited_28.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * *'
concurrency:
  group: autostock-ale-unlimited-28
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests -q
      - name: Preparar acceso de Alejandra
        env:
          MELI_APP_ID_NEW: ${{ secrets.MELI_APP_ID_NEW }}
          MELI_APP_SECRET_NEW: ${{ secrets.MELI_APP_SECRET_NEW }}
          MELI_REFRESH_TOKEN_ALE: ${{ secrets.MELI_REFRESH_TOKEN_ALE }}
        run: python scripts/prepare_ale_autostock_token.py
      - name: Guardar inmediatamente el token rotado
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_SECRETS }}
        run: gh secret set MELI_REFRESH_TOKEN_ALE --repo "${{ github.repository }}" < /tmp/ale_rotated_token
      - name: Vigilar y reponer cada 30 segundos
        run: python scripts/autostock_ale_unlimited_28.py
      - name: Reiniciar monitor
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_SECRETS }}
        run: gh workflow run autostock_ale_unlimited_28.yml --repo "${{ github.repository }}" --ref main
