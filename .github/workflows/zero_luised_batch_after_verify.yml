name: zero-luised-batch-after-edilberto-verified
on:
  workflow_dispatch:

concurrency:
  group: zero-luised-batch-after-edilberto-verified
  cancel-in-progress: false

jobs:
  zero:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests -q
      - name: Validate safety script
        run: python3 -m py_compile scripts/zero_luised_batch_after_verify.py
      - name: Verify Edilberto and zero LuisEd sources
        env:
          MELI_APP_ID_NEW: ${{ secrets.MELI_APP_ID_NEW }}
          MELI_APP_SECRET_NEW: ${{ secrets.MELI_APP_SECRET_NEW }}
          MELI_REFRESH_TOKEN_LUISED: ${{ secrets.MELI_REFRESH_TOKEN_LUISED }}
          MELI_REFRESH_TOKEN_EDILBERTO: ${{ secrets.MELI_REFRESH_TOKEN_EDILBERTO }}
        run: python3 scripts/zero_luised_batch_after_verify.py
      - name: Save rotated tokens
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_SECRETS }}
        run: |
          if [ -s /tmp/luised_rotated_token ]; then
            gh secret set MELI_REFRESH_TOKEN_LUISED --repo kxmwnzbzhn-spec/meli-autoresponder < /tmp/luised_rotated_token
          fi
          if [ -s /tmp/edilberto_rotated_token ]; then
            gh secret set MELI_REFRESH_TOKEN_EDILBERTO --repo kxmwnzbzhn-spec/meli-autoresponder < /tmp/edilberto_rotated_token
          fi
      - name: Results
        if: always()
        run: |
          if [ -s /tmp/zero_sources_results.json ]; then
            cat /tmp/zero_sources_results.json
          fi
