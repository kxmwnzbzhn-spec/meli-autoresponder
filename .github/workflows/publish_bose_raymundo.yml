name: publish-bose-raymundo
on: { workflow_dispatch: }
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { token: '${{ secrets.REPO_PAT }}' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests -q
      - env:
          MELI_APP_SECRET:                ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_RAYMUNDO:    ${{ secrets.MELI_REFRESH_TOKEN_RAYMUNDO }}
          TELEGRAM_BOT_TOKEN:             ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:               ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/publish_bose_raymundo.py
      - run: |
          git config user.email b@b.com && git config user.name bot
          for i in 1 2 3 4 5; do
            git pull --rebase 2>/dev/null && git add stock_config_raymundo.json && (git diff --cached --quiet || git commit -m "Bose SoundLink Home publicados en Raymundo (paused)") && git push origin main && break
            sleep 5
          done
