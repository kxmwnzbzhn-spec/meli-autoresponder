name: diag-wilbert-deep
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
        run: |
          python3 - <<'PY'
          import os, requests
          API="https://api.mercadolibre.com"
          tok=requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
              "client_id":os.environ["MELI_APP_ID"],
              "client_secret":os.environ["MELI_APP_SECRET"],
              "refresh_token":os.environ["MELI_REFRESH_TOKEN_WILBERT"]},timeout=20).json()["access_token"]
          h={"Authorization":f"Bearer {tok}"}
          UID=3367276814
          # Sin filtro de status
          j=requests.get(f"{API}/users/{UID}/items/search?limit=10",headers=h,timeout=20).json()
          print(f"sin status: total={j.get('paging',{}).get('total','?')} results={len(j.get('results',[]))}")
          if j.get("results"):
              print(f"  first 5: {j['results'][:5]}")
          # Probar otros estados
          for st in ("active","paused","closed","under_review","not_yet_active","expired","hold","scheduled","deleted","disabled"):
              j=requests.get(f"{API}/users/{UID}/items/search?status={st}&limit=1",headers=h,timeout=15).json()
              tot=j.get("paging",{}).get("total")
              if tot: print(f"  {st}: total={tot}")
          # Search publico por seller
          j2=requests.get(f"{API}/sites/MLM/search?seller_id={UID}&limit=10",headers=h,timeout=20).json()
          print(f"\npublic search total={j2.get('paging',{}).get('total')}")
          for it in (j2.get("results",[]) or [])[:5]:
              print(f"  {it.get('id')} {it.get('status')} '{it.get('title','')[:50]}'")
          PY
