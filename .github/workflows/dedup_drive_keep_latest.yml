name: dedup-drive-keep-latest
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1=dry run"
        default: "1"
      keep_days:
        description: "días a conservar (incluye hoy)"
        default: "1"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install google-api-python-client google-auth openpyxl requests -q
      - env:
          GOOGLE_OAUTH_CLIENT_ID:       ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET:   ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN:   ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN:           ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:             ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN:                      ${{ github.event.inputs.dry_run }}
          KEEP_DAYS:                    ${{ github.event.inputs.keep_days }}
        run: python scripts/dedup_drive_keep_latest.py
