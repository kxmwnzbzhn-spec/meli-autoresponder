name: Activar 14 Alejandra autostock ilimitado
on:
  push:
    paths:
      - '.github/workflows/activate_ale_14_unlimited_20260902.yml'
  workflow_dispatch:
jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests -q
      - name: Preparar acceso de Alejandra
        env:
          MELI_APP_ID_NEW: ${{ secrets.MELI_APP_ID_NEW }}
          MELI_APP_SECRET_NEW: ${{ secrets.MELI_APP_SECRET_NEW }}
          MELI_REFRESH_TOKEN_ALE: ${{ secrets.MELI_REFRESH_TOKEN_ALE }}
        run: python scripts/prepare_ale_autostock_token.py
      - name: Guardar token rotado
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_SECRETS }}
        run: gh secret set MELI_REFRESH_TOKEN_ALE --repo "${{ github.repository }}" < /tmp/ale_rotated_token
      - name: Activar, fijar una pieza y verificar
        run: python scripts/activate_ale_14_unlimited_20260902.py
