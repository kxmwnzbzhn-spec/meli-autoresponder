name: yir_cap_dry
on: { workflow_dispatch: { inputs: { test_cap: { default: "7" } } }, push: { paths: [.github/workflows/yir_cap_dry.yml] } }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - env:
          MELI_REFRESH_TOKEN_YC_NEW: ${{ secrets.MELI_REFRESH_TOKEN_YC_NEW }}
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          TEST_CAP: ${{ inputs.test_cap || '7' }}
        run: python scripts/yir_cap_dry.py
