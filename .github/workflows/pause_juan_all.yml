name: pause-juan-all
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN: ${{ secrets.MELI_REFRESH_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, requests, time
          API="https://api.mercadolibre.com"
          tok=requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
              "client_id":os.environ["MELI_APP_ID"],
              "client_secret":os.environ["MELI_APP_SECRET"],
              "refresh_token":os.environ["MELI_REFRESH_TOKEN"]},timeout=20).json()["access_token"]
          h={"Authorization":f"Bearer {tok}"}
          hj={**h,"Content-Type":"application/json"}
          uid=requests.get(f"{API}/users/me",headers=h).json()["id"]
          ids=[]; off=0
          while True:
              j=requests.get(f"{API}/users/{uid}/items/search?status=active&limit=50&offset={off}",headers=h,timeout=20).json()
              r=j.get("results",[]); ids+=r
              off+=50
              if off>=j.get("paging",{}).get("total",0) or not r: break
          print(f"Juan active items: {len(ids)}")
          paused=0; errs=0
          for iid in ids:
              r=requests.put(f"{API}/items/{iid}",headers=hj,json={"status":"paused"},timeout=15)
              if r.status_code in (200,201): paused+=1
              else: errs+=1; print(f"  ERR {iid}: {r.status_code} {r.text[:80]}")
              time.sleep(0.1)
          print(f"\n=== {paused}/{len(ids)} pausados, {errs} errores ===")
          PY
