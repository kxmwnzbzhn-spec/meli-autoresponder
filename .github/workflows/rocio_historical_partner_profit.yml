name: rocio-historical-partner-profit
on:
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests -q
      - run: python3 -m py_compile scripts/rocio_historical_partner_profit.py
      - name: Historical speaker profit and returns
        env:
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_ROCIOANGEL: ${{ secrets.MELI_REFRESH_TOKEN_ROCIOANGEL }}
        run: python3 scripts/rocio_historical_partner_profit.py
      - name: Save rotated token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_SECRETS }}
        run: |
          if [ -s /tmp/rocio_historical_rotated ]; then
            gh secret set MELI_REFRESH_TOKEN_ROCIOANGEL --repo kxmwnzbzhn-spec/meli-autoresponder < /tmp/rocio_historical_rotated
          fi
