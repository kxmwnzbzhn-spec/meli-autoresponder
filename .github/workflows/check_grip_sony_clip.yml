name: check-grip-sony-clip
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
        run: |
          python3 - <<'PY'
          import os, requests, re
          API="https://api.mercadolibre.com"
          tok=requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
              "client_id":os.environ["MELI_APP_ID"],
              "client_secret":os.environ["MELI_APP_SECRET"],
              "refresh_token":os.environ["MELI_REFRESH_TOKEN_WILBERT"]},timeout=20).json()["access_token"]
          h={"Authorization":f"Bearer {tok}"}
          UID=3367276814
          ids=[]; off=0
          while True:
              j=requests.get(f"{API}/users/{UID}/items/search?status=active&limit=50&offset={off}",headers=h,timeout=20).json()
              r=j.get("results",[]); ids+=r
              off+=50
              if off>=j.get("paging",{}).get("total",0) or not r: break
          items={}
          for i in range(0,len(ids),20):
              r=requests.get(f"{API}/items?ids={','.join(ids[i:i+20])}&attributes=id,title,price",headers=h,timeout=25).json()
              for it in r:
                  if it.get("code")==200: items[it["body"]["id"]]=it["body"]
          # Filtrar por Clip 5, Grip, Sony/XB100
          GRIP_RX=re.compile(r"\bgrip\b",re.I)
          SONY_RX=re.compile(r"\bsony\b|xb100",re.I)
          CLIP_RX=re.compile(r"\bclip\s*5\b",re.I)
          for label,rx in (("CLIP 5",CLIP_RX),("GRIP",GRIP_RX),("SONY/XB100",SONY_RX)):
              print(f"\n=== {label} ===")
              targets=[(iid,b) for iid,b in items.items() if rx.search(b.get("title",""))]
              print(f"  total: {len(targets)}")
              for iid,b in targets:
                  cur=b.get("price")
                  try:
                      p=requests.get(f"{API}/items/{iid}/price_to_win?version=v2",headers=h,timeout=12).json()
                  except: continue
                  ptw=p.get("price_to_win") or 0
                  st=p.get("status",""); sh=p.get("competitors_sharing_first_place",0) or 0
                  bbw=p.get("winner") or {}
                  is_full=any(x.get("id")=="fulfillment" and x.get("status")=="boosted" for x in bbw.get("boosts",[]))
                  print(f"    {iid} ${cur} ptw={ptw} st={st} sh={sh} full={is_full} '{b.get('title','')[:48]}'")
          PY
