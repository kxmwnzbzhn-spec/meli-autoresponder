name: clone-charge6-camuflaje
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN: ${{ secrets.MELI_REFRESH_TOKEN }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
        run: |
          python3 - <<'PY'
          import os, requests
          API="https://api.mercadolibre.com"
          def tok(rt):
              return requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
                  "client_id":os.environ["MELI_APP_ID"],
                  "client_secret":os.environ["MELI_APP_SECRET"],
                  "refresh_token":rt},timeout=20).json().get("access_token")
          tj=tok(os.environ["MELI_REFRESH_TOKEN"])
          tw=tok(os.environ["MELI_REFRESH_TOKEN_WILBERT"])
          hj={"Authorization":f"Bearer {tj}"}
          hwj={"Authorization":f"Bearer {tw}","Content-Type":"application/json"}
          src=requests.get(f"{API}/items/MLM2894654315?include_attributes=all",headers=hj).json()
          attrs=[]
          for a in src.get("attributes",[]) or []:
              if a.get("id") in ("BRAND","MODEL","ITEM_CONDITION","DETAILED_MODEL","ITEM_VOLUME"):
                  v={"id":a["id"]}
                  if a.get("value_id"): v["value_id"]=a["value_id"]
                  if a.get("value_name"): v["value_name"]=a["value_name"]
                  attrs.append(v)
          attrs.append({"id":"COLOR","value_name":"Camuflaje"})
          # SIN GTIN
          sale_terms=[]
          for st in src.get("sale_terms",[]) or []:
              v={"id":st["id"]}
              if st.get("value_id"): v["value_id"]=st["value_id"]
              if st.get("value_name"): v["value_name"]=st["value_name"]
              sale_terms.append(v)
          if not any(s.get("id")=="WARRANTY_TIME" for s in sale_terms):
              sale_terms.append({"id":"WARRANTY_TYPE","value_name":"Garantía del vendedor"})
              sale_terms.append({"id":"WARRANTY_TIME","value_name":"30 días"})
          pics=[{"id":p["id"]} for p in (src.get("pictures") or []) if p.get("id")]
          shipping=src.get("shipping") or {"mode":"me2","free_shipping":True,"logistic_type":"xd_drop_off","local_pick_up":False}
          body={"site_id":"MLM","title":"Bocina Jbl Charge 6 Bluetooth Ip67 Reacondicionada Camuflaje"[:60],
            "category_id":src.get("category_id"),"price":src.get("price",399),"currency_id":"MXN",
            "available_quantity":1,"buying_mode":"buy_it_now","listing_type_id":src.get("listing_type_id","gold_pro"),
            "condition":src.get("condition","used"),"shipping":shipping,"pictures":pics,
            "attributes":attrs,"sale_terms":sale_terms}
          r=requests.post(f"{API}/items",headers=hwj,json=body,timeout=45)
          print(f"POST: {r.status_code}")
          if r.status_code in (200,201):
              print(f"*** NUEVO: {r.json().get('id')} ***")
          else:
              print(r.text[:400])
          PY
