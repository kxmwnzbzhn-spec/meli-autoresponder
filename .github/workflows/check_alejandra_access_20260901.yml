name: check-alejandra-access-20260901

on:
  push:
    paths:
      - ".github/workflows/check_alejandra_access_20260901.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - run: pip install requests -q
      - name: Verify Alejandra Mercado Libre access
        env:
          MELI_APP_ID_NEW: ${{ secrets.MELI_APP_ID_NEW }}
          MELI_APP_SECRET_NEW: ${{ secrets.MELI_APP_SECRET_NEW }}
          MELI_REFRESH_TOKEN_ALE: ${{ secrets.MELI_REFRESH_TOKEN_ALE }}
        run: |
          python3 - <<'PY'
          import json, os, requests
          r=requests.post("https://api.mercadolibre.com/oauth/token",data={
            "grant_type":"refresh_token",
            "client_id":os.environ["MELI_APP_ID_NEW"],
            "client_secret":os.environ["MELI_APP_SECRET_NEW"],
            "refresh_token":os.environ["MELI_REFRESH_TOKEN_ALE"],
          },timeout=30)
          r.raise_for_status()
          t=r.json()
          open("/tmp/ale_rotated_token","w").write(t["refresh_token"])
          h={"Authorization":"Bearer "+t["access_token"]}
          me=requests.get("https://api.mercadolibre.com/users/me",headers=h,timeout=30)
          me.raise_for_status()
          user=me.json()
          items=requests.get(f"https://api.mercadolibre.com/users/{user['id']}/items/search",headers=h,params={"limit":1},timeout=30)
          items.raise_for_status()
          print("ALE_ACCESS_RESULT="+json.dumps({
            "id":user.get("id"),"nickname":user.get("nickname"),"status":user.get("status"),
            "site_id":user.get("site_id"),"items_total":items.json().get("paging",{}).get("total")
          },ensure_ascii=False))
          PY
      - name: Save rotated Alejandra token
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_FOR_SECRETS }}
        run: gh secret set MELI_REFRESH_TOKEN_ALE --repo kxmwnzbzhn-spec/meli-autoresponder < /tmp/ale_rotated_token
