name: dump-secrets-3
on: { workflow_dispatch: {}, push: { paths: [.github/workflows/dump_secrets_3.yml] } }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - env:
          APP_ID: ${{ secrets.MELI_APP_ID }}
          APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          RT_ASVA: ${{ secrets.MELI_REFRESH_TOKEN_ASVA }}
        run: python scripts/dump_secrets_v3.py
