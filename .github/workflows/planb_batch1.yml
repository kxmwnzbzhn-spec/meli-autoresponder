name: planb-batch1
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
          MELI_REFRESH_TOKEN_YC_NEW: ${{ secrets.MELI_REFRESH_TOKEN_YC_NEW }}
        run: |
          python3 - <<'PY'
          import os, requests, time
          API="https://api.mercadolibre.com"
          def tok(rt):
              return requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
                  "client_id":os.environ["MELI_APP_ID"],
                  "client_secret":os.environ["MELI_APP_SECRET"],
                  "refresh_token":rt},timeout=20).json().get("access_token")
          tw=tok(os.environ["MELI_REFRESH_TOKEN_WILBERT"])
          ty=tok(os.environ["MELI_REFRESH_TOKEN_YC_NEW"])
          hw={"Authorization":f"Bearer {tw}"}
          hwj={**hw,"Content-Type":"application/json"}
          hy={"Authorization":f"Bearer {ty}"}
          hyj={**hy,"Content-Type":"application/json"}
          # Lote 1: 10 bocinas NO clonadas previamente
          BATCH=["MLM5287500034","MLM5287499028","MLM5287499008","MLM5287500734","MLM5287497362","MLM5287497338","MLM5287495728","MLM5287500058","MLM5287501100","MLM5287384768"]
          # Y los 18 ya clonadas previamente (a borrar en Wilbert)
          ALREADY_CLONED=["MLM5287368936","MLM5287356778","MLM2907543355","MLM2907544761","MLM5287354114","MLM5287495718","MLM5287354124","MLM5287354126","MLM5287374792","MLM5287368920","MLM5287384822","MLM5287372100","MLM5287385518","MLM5287387574","MLM5287495722","MLM5287497352","MLM2907544753","MLM5287360662"]
          
          cloned=0; close_errs=0; clone_errs=0
          # FASE A: clonar 10 nuevas
          for src in BATCH:
              print(f"\n=== CLONAR {src} ===")
              it=requests.get(f"{API}/items/{src}?include_attributes=all",headers=hw).json()
              if not it.get("title"):
                  print(f"  err src: {it}"); clone_errs+=1; continue
              attrs=[]
              for a in it.get("attributes",[]) or []:
                  if a.get("id") in ("BRAND","MODEL","COLOR","ITEM_CONDITION","DETAILED_MODEL","MAIN_COLOR","ITEM_VOLUME"):
                      v={"id":a["id"]}
                      if a.get("value_id"): v["value_id"]=a["value_id"]
                      if a.get("value_name"): v["value_name"]=a["value_name"]
                      attrs.append(v)
              sale_terms=[]
              for st in it.get("sale_terms",[]) or []:
                  v={"id":st["id"]}
                  if st.get("value_id"): v["value_id"]=st["value_id"]
                  if st.get("value_name"): v["value_name"]=st["value_name"]
                  sale_terms.append(v)
              pics=[{"id":p["id"]} for p in (it.get("pictures") or []) if p.get("id")]
              shipping=it.get("shipping") or {"mode":"me2","free_shipping":True,"logistic_type":"xd_drop_off","local_pick_up":False}
              cpid=it.get("catalog_product_id")
              body={"site_id":"MLM","title":(it.get("title") or "")[:60],"category_id":it.get("category_id"),
                "price":it.get("price",499),"currency_id":"MXN","available_quantity":1,"buying_mode":"buy_it_now",
                "listing_type_id":it.get("listing_type_id","gold_pro"),"condition":it.get("condition","used"),
                "shipping":shipping,"pictures":pics,"attributes":attrs,"sale_terms":sale_terms}
              if cpid:
                  body["catalog_product_id"]=cpid; body["catalog_listing"]=True
              r=requests.post(f"{API}/items",headers=hyj,json=body,timeout=45)
              if r.status_code in (200,201):
                  cloned+=1
                  new=r.json().get("id")
                  print(f"  clonado: {new}")
              else:
                  clone_errs+=1
                  print(f"  err: {r.status_code} {r.text[:300]}")
              time.sleep(1)

          # FASE B: cerrar en Wilbert TODAS las 28 (10 nuevas + 18 ya clonadas)
          print("\n=== CERRAR EN WILBERT ===")
          closed=0
          for iid in BATCH + ALREADY_CLONED:
              r=requests.put(f"{API}/items/{iid}",headers=hwj,json={"status":"closed"},timeout=15)
              if r.status_code in (200,201): closed+=1
              else: 
                  close_errs+=1
                  print(f"  ERR {iid}: {r.status_code} {r.text[:120]}")
              time.sleep(0.1)
          print(f"\n=== RESUMEN LOTE 1 ===")
          print(f"  cloned: {cloned}/{len(BATCH)}  clone_errs={clone_errs}")
          print(f"  closed: {closed}/{len(BATCH)+len(ALREADY_CLONED)}  close_errs={close_errs}")
          PY
