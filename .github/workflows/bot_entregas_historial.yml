name: bot-entregas-historial
on:
  schedule:
    - cron: "0 4 * * *"   # 22:00 CDMX (UTC-6)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests -q
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/bot_entregas_historial.py
      - name: Commit historial CSV
        run: |
          git config user.email "bot@local"
          git config user.name "bot"
          git pull --rebase 2>/dev/null || true
          git add data/bot_entregas_history/*.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Bot entregas historial $(date +%F)"
          git push origin main 2>/dev/null || true
