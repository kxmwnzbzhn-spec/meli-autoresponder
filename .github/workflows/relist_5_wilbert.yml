name: relist-5-wilbert
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
        run: |
          python3 - <<'PY'
          import os, requests, time
          API="https://api.mercadolibre.com"
          tok=requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
              "client_id":os.environ["MELI_APP_ID"],
              "client_secret":os.environ["MELI_APP_SECRET"],
              "refresh_token":os.environ["MELI_REFRESH_TOKEN_WILBERT"]},timeout=20).json()["access_token"]
          h={"Authorization":f"Bearer {tok}"}
          hj={**h,"Content-Type":"application/json"}
          IIDS=["MLM5266046030","MLM5265893746","MLM5266032976","MLM5265868092","MLM5265906396"]
          for iid in IIDS:
              print(f"\n=== {iid} ===")
              it=requests.get(f"{API}/items/{iid}",headers=h).json()
              st=it.get("status"); price=it.get("price"); title=(it.get("title") or "")[:55]
              print(f"  Antes: st={st} price={price} '{title}'")
              listing_type=it.get("listing_type_id","gold_pro")
              # Step 1: cerrar
              r1=requests.put(f"{API}/items/{iid}",headers=hj,json={"status":"closed"},timeout=15)
              print(f"  close: {r1.status_code}")
              if r1.status_code not in (200,201):
                  print(f"    err: {r1.text[:200]}")
                  continue
              time.sleep(2)
              # Step 2: relist
              r2=requests.post(f"{API}/items/{iid}/relist",headers=hj,
                  json={"listing_type_id":listing_type},timeout=20)
              print(f"  relist: {r2.status_code}")
              if r2.status_code in (200,201):
                  new_id=r2.json().get("id",iid)
                  if new_id!=iid:
                      print(f"  → nuevo IID: {new_id}")
                  # active + qty=1
                  r3=requests.put(f"{API}/items/{new_id}",headers=hj,
                      json={"available_quantity":1,"status":"active"},timeout=15)
                  print(f"  active+qty1: {r3.status_code}")
              else:
                  print(f"    err relist: {r2.text[:300]}")
              time.sleep(1)
          PY
