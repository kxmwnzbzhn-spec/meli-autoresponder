name: check-dup-2910768335
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
        run: |
          python3 - <<'PY'
          import os, requests
          API="https://api.mercadolibre.com"
          tok=requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
              "client_id":os.environ["MELI_APP_ID"],
              "client_secret":os.environ["MELI_APP_SECRET"],
              "refresh_token":os.environ["MELI_REFRESH_TOKEN_WILBERT"]},timeout=20).json()["access_token"]
          h={"Authorization":f"Bearer {tok}"}
          IID="MLM2910768335"
          it=requests.get(f"{API}/items/{IID}",headers=h).json()
          cpid=it.get("catalog_product_id")
          print(f"REF: {IID} cpid={cpid} status={it.get('status')} sold={it.get('sold_quantity')} price=${it.get('price')} title='{it.get('title','')[:60]}'")
          if not cpid: print("Sin cpid, no hay duplicados por catalog"); raise SystemExit(0)
          # Listar todos active con mismo cpid
          uid=3367276814
          ids=[]
          for st in ("active","paused"):
              off=0
              while True:
                  j=requests.get(f"{API}/users/{uid}/items/search?status={st}&limit=50&offset={off}",headers=h,timeout=20).json()
                  r=j.get("results",[]); ids+=r
                  off+=50
                  if off>=j.get("paging",{}).get("total",0) or not r: break
          # Bulk
          dups=[]
          for i in range(0,len(ids),20):
              r=requests.get(f"{API}/items?ids={','.join(ids[i:i+20])}&attributes=id,catalog_product_id,sold_quantity,price,status,title,date_created",headers=h,timeout=20).json()
              for it2 in r:
                  if it2.get("code")==200:
                      b=it2["body"]
                      if b.get("catalog_product_id")==cpid:
                          dups.append(b)
          print(f"\nItems con mismo cpid {cpid}: {len(dups)}")
          for b in dups:
              print(f"  {b['id']} sold={b.get('sold_quantity')} price=${b.get('price')} st={b.get('status')} '{b.get('title','')[:50]}'")
          PY
