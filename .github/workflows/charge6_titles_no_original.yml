name: charge6-titles-no-original
on: { workflow_dispatch: {} }
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - run: pip install requests -q
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_WILBERT: ${{ secrets.MELI_REFRESH_TOKEN_WILBERT }}
        run: |
          python3 - <<'PY'
          import os, requests, time
          API="https://api.mercadolibre.com"
          tok=requests.post(f"{API}/oauth/token",data={"grant_type":"refresh_token",
              "client_id":os.environ["MELI_APP_ID"],
              "client_secret":os.environ["MELI_APP_SECRET"],
              "refresh_token":os.environ["MELI_REFRESH_TOKEN_WILBERT"]},timeout=20).json()["access_token"]
          h={"Authorization":f"Bearer {tok}"}
          hj={**h,"Content-Type":"application/json"}
          UPDATES=[
            ("MLM2911241921","JBL Charge 6 Bocina Bluetooth IP67 Reacondicionada Negro"),
            ("MLM5295749840","JBL Charge 6 Bocina Bluetooth IP67 Reacondicionada Azul"),
            ("MLM2911241939","JBL Charge 6 Bocina Bluetooth IP67 Reacondicionada Rojo"),
            ("MLM2911205487","JBL Charge 6 Bocina Bluetooth IP67 Reacondicionada Camuflaje"),
          ]
          for iid,title in UPDATES:
              r=requests.put(f"{API}/items/{iid}",headers=hj,json={"title":title[:60]},timeout=15)
              print(f"{iid}: {r.status_code} '{title}'")
              if r.status_code not in (200,201):
                  print(f"  err: {r.text[:200]}")
              time.sleep(0.3)
          PY
