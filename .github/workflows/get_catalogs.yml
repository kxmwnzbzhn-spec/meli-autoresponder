name: get-catalogs
on: { workflow_dispatch: {}, push: { paths: [.github/workflows/get_catalogs.yml] } }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install requests
      - env:
          MELI_APP_ID: ${{ secrets.MELI_APP_ID }}
          MELI_APP_SECRET: ${{ secrets.MELI_APP_SECRET }}
          MELI_REFRESH_TOKEN_ASVA: ${{ secrets.MELI_REFRESH_TOKEN_ASVA }}
          TOKEN_SHARED: ${{ secrets.TOKEN_SHARED }}
        run: python scripts/get_catalogs.py
